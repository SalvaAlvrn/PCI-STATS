<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supervisiones PCI</title>
<style>
:root {
  color-scheme: light;
  --plane:          #eceae4;
  --surface:        #ffffff;
  --text-primary:   #0b0b0b;
  --text-secondary: #4a4945;
  --text-muted:     #74736e;
  --grid:           #d8d6cd;
  --axis:           #a9a89d;
  --border:         rgba(11,11,11,0.22);
  --shadow:         0 1px 2px rgba(11,11,11,0.06), 0 2px 8px rgba(11,11,11,0.06);
  --series-1:       #2a78d6;
  --series-2:       #eb6834;
  --series-3:       #1f8f68;
  --context:        #c3c2b7;
  --good:           #0ca30c;
  --critical:       #d03b3b;
  --warning:        #fab219;
  --serious:        #ec835a;
  --seq-100: #cde2fb; --seq-250: #86b6ef; --seq-400: #3987e5;
  --seq-550: #1c5cab; --seq-700: #0d366b;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane: #0b0b0b; --surface: #1f1f1d;
    --text-primary: #ffffff; --text-secondary: #cfcec6; --text-muted: #98968e;
    --grid: #34342f; --axis: #4a4a44; --border: rgba(255,255,255,0.20);
    --shadow: 0 1px 2px rgba(0,0,0,0.5), 0 2px 10px rgba(0,0,0,0.35);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #35b184;
    --context: #52514e;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0b0b0b; --surface: #1f1f1d;
  --text-primary: #ffffff; --text-secondary: #cfcec6; --text-muted: #98968e;
  --grid: #34342f; --axis: #4a4a44; --border: rgba(255,255,255,0.20);
  --shadow: 0 1px 2px rgba(0,0,0,0.5), 0 2px 10px rgba(0,0,0,0.35);
  --series-1: #3987e5; --series-2: #d95926; --series-3: #35b184;
  --context: #52514e;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--plane); color: var(--text-primary);
  font-family: var(--sans); font-size: 14px; line-height: 1.5;
}
.wrap { max-width: 1200px; margin: 0 auto; padding: 24px 20px 64px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; }
h2 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
.sub { color: var(--text-secondary); font-size: 13px; }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px 18px; margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 860px) { .grid-2 { grid-template-columns: 1fr; } }

/* El contenedor crece con su contenido: fijar la altura recortaría la
   banda del eje X y crearía un scroll anidado dentro del card. */
.plot { position: relative; height: 260px; }

/* Un solo marco para toda la fila. El gap de 1px deja ver el fondo del
   contenedor y hace de separador: con flex-wrap los bordes por celda dejaban
   filos dobles al saltar de línea. */
.kpis {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
  gap: 1px; background: var(--border);
  border: 1px solid var(--border); border-radius: 10px;
  overflow: hidden; box-shadow: var(--shadow);
}
.kpi {
  background: var(--surface); border: 0; border-radius: 0; box-shadow: none;
  padding: 12px 16px; min-width: 0;
}
.kpi .label { color: var(--text-secondary); font-size: 12px; }
.kpi .value { font-size: 26px; font-weight: 600; margin-top: 2px; }
.kpi .delta { font-size: 12px; color: var(--text-secondary); }
.hero { font-size: 48px; font-weight: 600; line-height: 1.1; }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--grid); }
th {
  color: var(--text-secondary); font-weight: 600; cursor: pointer;
  position: sticky; top: 0; background: var(--surface);
  border-bottom: 2px solid var(--axis);
}
tbody tr:nth-child(even) { background: color-mix(in srgb, var(--plane) 55%, var(--surface)); }
tbody tr:hover { background: color-mix(in srgb, var(--series-1) 12%, var(--surface)); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tfoot td { font-weight: 600; border-top: 2px solid var(--border); border-bottom: none; }
.scroll-x { overflow-x: auto; }

.tabs { display: flex; gap: 4px; margin-bottom: 16px; }
.tabs button {
  font: inherit; padding: 7px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--border); background: transparent; color: var(--text-secondary);
}
.tabs button[aria-selected="true"] {
  background: var(--surface); color: var(--text-primary); font-weight: 600;
  border-color: var(--text-primary); box-shadow: inset 0 -2px 0 var(--series-1);
}

/* Los filtros y sus chips activos viven en un mismo bloque: sueltos sobre el
   plano no se leían como un control único. */
.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.panel .filters, .panel .chips { margin-bottom: 0; }
.panel .chips { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--grid); }
.panel .chips:empty { display: none; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 12px; }
.filters label { display: flex; flex-direction: column; font-size: 12px; color: var(--text-secondary); gap: 3px; }
.filters select, .filters input {
  font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-primary);
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chip {
  font-size: 12px; padding: 3px 8px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface); cursor: pointer;
}
.empty { color: var(--text-secondary); padding: 28px 0; text-align: center; }

/* Mapa de calor: CSS Grid en lugar de un plugin de Chart.js. Menos código,
   control total del gap de 2px y de los tooltips. */
.heat { display: grid; gap: 2px; font-size: 11px; }
.heat .cell { padding: 6px 4px; text-align: center; border-radius: 3px; }
.heat .rowlab, .heat .collab { color: var(--text-secondary); padding: 4px; }
.heat .rowlab { text-align: right; white-space: nowrap; }

.tip {
  position: fixed; pointer-events: none; z-index: 20; display: none;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px;
  box-shadow: var(--shadow); max-width: 280px;
}
.tip .v { font-weight: 600; font-size: 14px; color: var(--text-primary); }
.tip .k { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; }
.tip .n { color: var(--text-secondary); }
</style>
</head>

  <header style="display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:18px">
    <div>
      <h1>Supervisiones PCI</h1>
      <div class="sub" id="meta"></div>

    <button id="theme" class="chip" type="button">Cambiar tema</button>

</div>

<script>const DATA = /*__DATA__*/;</script>
<script id="mod-store">
const store = (() => {
  const DIMS_FILTRABLES = [
    'medida', 'submedida', 'unidad', 'grupo', 'cargo', 'estado'
  ];
  const filters = {desde: null, hasta: null};
  DIMS_FILTRABLES.forEach(k => { filters[k] = null; });

  const oyentes = [];
  const n = DATA.rows.cumple.length;

  function activeRows() {
    const r = DATA.rows;
    const out = [];
    for (let i = 0; i < n; i++) {
      if (filters.desde !== null && r.dia[i] < filters.desde) continue;
      if (filters.hasta !== null && r.dia[i] > filters.hasta) continue;
      let pasa = true;
      for (const k of DIMS_FILTRABLES) {
        if (filters[k] !== null && r[k][i] !== filters[k]) { pasa = false; break; }
      }
      if (pasa) out.push(i);
    }
    return out;
  }

  function set(clave, valor) { filters[clave] = valor; emit(); }
  function clear(clave) { filters[clave] = null; emit(); }
  function clearAll() {
    Object.keys(filters).forEach(k => { filters[k] = null; });
    emit();
  }
  function onChange(fn) { oyentes.push(fn); }
  function emit() { oyentes.forEach(fn => fn()); }

  return {filters, dimsFiltrables: DIMS_FILTRABLES,
          activeRows, set, clear, clearAll, onChange, emit};
})();
</script>

<script id="mod-agg">
/** Fábrica de agregación sobre un dataset con `rows` y `dims`.
 *
 * Es fábrica y no módulo suelto porque el dashboard tiene dos datasets —las
 * supervisiones y los envíos de IAAS— y duplicar la agregación para el
 * segundo dejaría dos copias que divergen.
 */
function crearAgg(dataset) {
  const r = dataset.rows;
  const DIMS = dataset.dims;

  /** Tasa sobre los registros con dictamen. null si no hay ninguno. */
  function tasaDe(si, no) {
    const conDictamen = si + no;
    return conDictamen === 0 ? null : si / conDictamen;
  }

  function kpis(rows) {
    let si = 0, no = 0, sin = 0, aprobados = 0;
    const resp = new Set(), form = new Set();
    const idxAprobado = DIMS.estado.indexOf('Aprobado');
    for (const i of rows) {
      if (r.cumple[i] === 1) si++;
      else if (r.cumple[i] === 0) no++;
      else sin++;
      if (r.estado[i] === idxAprobado) aprobados++;
      resp.add(r.responsable[i]);
      form.add(r.formulario[i]);
    }
    return {
      total: rows.length,
      conDictamen: si + no,
      sinDictamen: sin,
      tasa: tasaDe(si, no),
      aprobados,
      tasaAprobado: rows.length ? aprobados / rows.length : null,
      responsables: resp.size,
      formularios: form.size
    };
  }

  /** Fila de total para una tabla construida con `rateBy`.
   *
   * La tasa se pondera por volumen —se recalcula sobre la suma de dictámenes—
   * en vez de promediar las tasas por fila. Promediarlas daría a un formulario
   * de dos registros el mismo peso que a uno de doscientos, y el número no
   * cuadraría con el KPI de cumplimiento de la misma vista.
   */
  function totalDe(entradas) {
    let si = 0, no = 0, total = 0;
    for (const e of entradas) { si += e.si; no += e.no; total += e.total; }
    return {n: entradas.length, total, tasa: tasaDe(si, no)};
  }

  function rateBy(rows, dimKey) {
    const etiquetas = DIMS[dimKey];
    const acc = new Map();
    for (const i of rows) {
      const idx = r[dimKey][i];
      let e = acc.get(idx);
      if (!e) { e = {idx, label: etiquetas[idx], si: 0, no: 0, sin: 0}; acc.set(idx, e); }
      if (r.cumple[i] === 1) e.si++;
      else if (r.cumple[i] === 0) e.no++;
      else e.sin++;
    }
    const salida = [...acc.values()];
    for (const e of salida) {
      e.total = e.si + e.no + e.sin;
      e.tasa = tasaDe(e.si, e.no);
    }
    // Los que no tienen dictamen van al final: no son "los peores", son
    // "los que no se pueden puntuar".
    salida.sort((a, b) => {
      if (a.tasa === null && b.tasa === null) return b.total - a.total;
      if (a.tasa === null) return 1;
      if (b.tasa === null) return -1;
      return b.tasa - a.tasa || b.total - a.total;
    });
    return salida;
  }

  function series(rows, periodo) {
    const etiquetas = DIMS[periodo];
    const presentes = new Set();
    const si = new Map(), no = new Map(), vol = new Map();
    for (const i of rows) {
      const p = r[periodo][i];
      presentes.add(p);
      vol.set(p, (vol.get(p) || 0) + 1);
      if (r.cumple[i] === 1) si.set(p, (si.get(p) || 0) + 1);
      else if (r.cumple[i] === 0) no.set(p, (no.get(p) || 0) + 1);
    }
    // dims.mes y dims.semana vienen ordenados alfabéticamente desde Python,
    // que para "YYYY-MM" y "YYYY-Www" equivale al orden cronológico.
    const presentesOrdenados = [...presentes].sort((a, b) => a - b);
    // Se completan los períodos intermedios sin filas para que un hueco de
    // varios meses se vea como un hueco (la línea se corta ahí gracias a
    // spanGaps: false) y no como un solo paso que aplana la tendencia real.
    const orden = presentesOrdenados.length
      ? Array.from(
          {length: presentesOrdenados[presentesOrdenados.length - 1]
                   - presentesOrdenados[0] + 1},
          (_, k) => presentesOrdenados[0] + k
        )
      : [];
    return {
      labels: orden.map(p => etiquetas[p]),
      volumen: orden.map(p => vol.get(p) || 0),
      tasa: orden.map(p => tasaDe(si.get(p) || 0, no.get(p) || 0))
    };
  }

  function heatmap(rows, dimKey, periodo) {
    const filasPresentes = new Set(), colsPresentes = new Set();
    const si = new Map(), no = new Map(), tot = new Map();
    const clave = (f, c) => f + '|' + c;
    for (const i of rows) {
      const f = r[dimKey][i], c = r[periodo][i];
      filasPresentes.add(f); colsPresentes.add(c);
      const k = clave(f, c);
      tot.set(k, (tot.get(k) || 0) + 1);
      if (r.cumple[i] === 1) si.set(k, (si.get(k) || 0) + 1);
      else if (r.cumple[i] === 0) no.set(k, (no.get(k) || 0) + 1);
    }
    const fs = [...filasPresentes].sort((a, b) => a - b);
    const cs = [...colsPresentes].sort((a, b) => a - b);
    return {
      rowLabels: fs.map(f => DIMS[dimKey][f]),
      colLabels: cs.map(c => DIMS[periodo][c]),
      cells: fs.map(f => cs.map(c => {
        const k = clave(f, c);
        return {
          tasa: tasaDe(si.get(k) || 0, no.get(k) || 0),
          total: tot.get(k) || 0
        };
      }))
    };
  }

  return {kpis, rateBy, series, heatmap, tasaDe, totalDe};
}
const agg = crearAgg(DATA);
</script>
<script id="mod-vigilancia">
/** Agregación del apartado de vigilancia de IAAS.
 *
 * Una fila por caso vigilado. Todo se recalcula sobre el subconjunto que
 * dejan los filtros: si las tarjetas clínicas trajesen totales precalculados,
 * dirían una cosa distinta de la que el filtro promete.
 */
function crearVigilancia(vig) {
  const r = vig.rows;
  const n = r.dia.length;
  const E = vig.etiquetas;
  const iConfirmado = vig.dims.definicion.indexOf(E.confirmado);

  // Dimensiones de un valor por caso; el filtro compara el índice.
  const SIMPLES = ['definicion', 'servicio', 'ubicacion', 'diagnostico',
                   'origen', 'condicion', 'sexo'];
  // Dimensiones de varios valores por caso; viajan como matriz etiqueta×caso.
  const MATRICES = ['microorganismo', 'dispositivo', 'causa'];

  /** ¿Pasa el caso los filtros que no son de fecha? */
  function pasaDimensiones(f, i) {
    for (const clave of SIMPLES) {
      if (f[clave] != null && r[clave][i] !== f[clave]) return false;
    }
    for (const clave of MATRICES) {
      if (f[clave] != null && r[clave][f[clave]][i] !== 1) return false;
    }
    return true;
  }

  function filasActivas(f) {
    const out = [];
    for (let i = 0; i < n; i++) {
      // Un caso sin fecha de notificación no se puede situar en el tiempo:
      // desaparece en cuanto hay filtro de fechas, y solo entonces.
      if ((f.desde !== null || f.hasta !== null) && r.dia[i] === null) continue;
      if (f.desde !== null && r.dia[i] < f.desde) continue;
      if (f.hasta !== null && r.dia[i] > f.hasta) continue;
      if (!pasaDimensiones(f, i)) continue;
      out.push(i);
    }
    return out;
  }

  /** Casos que el filtro de fechas deja fuera por no tener fecha.
   *
   * Cumplen el resto de filtros y aun así no aparecen. Sin decirlo, el total
   * de la pestaña baja al filtrar por fechas y parece que hubo menos casos.
   */
  function excluidosPorFecha(f) {
    if (f.desde === null && f.hasta === null) return 0;
    let fuera = 0;
    for (let i = 0; i < n; i++) {
      if (r.dia[i] === null && pasaDimensiones(f, i)) fuera++;
    }
    return fuera;
  }

  const esConfirmado = i => r.definicion[i] === iConfirmado;
  const confirmados = filas => filas.filter(esConfirmado);
  const indiceDe = (clave, etiqueta) => vig.dims[clave].indexOf(etiqueta);

  // Más casos arriba; a igualdad, alfabético para que no baile entre builds.
  const ordenar = filas => filas.sort(
    (a, b) => b.casos - a.casos || a.label.localeCompare(b.label, 'es'));

  function kpis(filas) {
    const conf = confirmados(filas);
    const iFallecido = indiceDe('condicion', 'Fallecido');
    const iPendiente = indiceDe('vigepes', 'Pendiente');
    let fallecidos = 0, pendientes = 0, investigados = 0, cerrados = 0;
    for (const i of conf) {
      if (r.condicion[i] === iFallecido) fallecidos++;
      if (r.vigepes[i] === iPendiente) pendientes++;
    }
    for (const i of filas) {
      if (r.investigado[i] === 1) investigados++;
      if (r.cerrado[i] === 1) cerrados++;
    }
    return {
      casos: filas.length, confirmados: conf.length, fallecidos, pendientes,
      investigados, cerrados,
      // Letalidad sobre confirmados: sobre notificados mezclaría con los que
      // resultaron no ser IAAS y saldría siempre más baja de lo que es.
      letalidad: conf.length ? fallecidos / conf.length : null,
      confirmacion: filas.length ? conf.length / filas.length : null
    };
  }

  /** Embudo de vigilancia: de caso notificado a investigación cerrada. */
  function embudo(filas) {
    const cuenta = etiqueta => {
      const k = indiceDe('definicion', etiqueta);
      return filas.filter(i => r.definicion[i] === k).length;
    };
    return [
      {label: 'Notificados', casos: filas.length},
      {label: 'Con investigación', casos: filas.filter(i => r.investigado[i] === 1).length},
      {label: 'Confirmados', casos: cuenta(E.confirmado)},
      {label: 'Sospechosos', casos: cuenta(E.sospechoso)},
      {label: 'Descartados (no IAAS)', casos: cuenta(E.no_iaas)},
      {label: 'Investigación cerrada', casos: filas.filter(i => r.cerrado[i] === 1).length}
    ];
  }

  function porDim(filas, clave) {
    const etiquetas = vig.dims[clave];
    const acc = new Map();
    for (const i of filas) acc.set(r[clave][i], (acc.get(r[clave][i]) || 0) + 1);
    return ordenar([...acc].map(([k, casos]) => ({label: etiquetas[k], casos})));
  }

  function porMulti(filas, clave) {
    const etiquetas = vig.dims[clave];
    const matriz = r[clave];
    const salida = [];
    for (let k = 0; k < etiquetas.length; k++) {
      let casos = 0;
      for (const i of filas) if (matriz[k][i] === 1) casos++;
      // Una etiqueta con cero casos alarga el ranking sin decir nada.
      if (casos) salida.push({label: etiquetas[k], casos});
    }
    return ordenar(salida);
  }

  /** Recuento de una dimensión cruzado con otra: fallecidos por diagnóstico. */
  function porDimCon(filas, clave, claveMarca, etiquetaMarca) {
    const etiquetas = vig.dims[clave];
    const marca = indiceDe(claveMarca, etiquetaMarca);
    const acc = new Map();
    for (const i of filas) {
      const k = r[clave][i];
      const e = acc.get(k) || {label: etiquetas[k], casos: 0, marcados: 0};
      e.casos++;
      if (r[claveMarca][i] === marca) e.marcados++;
      acc.set(k, e);
    }
    return ordenar([...acc.values()]);
  }

  /** Serie temporal: confirmados frente al resto de notificaciones. */
  function serie(filas, periodo) {
    const etiquetas = vig.dims[periodo];
    const conf = etiquetas.map(() => 0);
    const otros = etiquetas.map(() => 0);
    for (const i of filas) {
      const k = r[periodo][i];
      if (esConfirmado(i)) conf[k]++; else otros[k]++;
    }
    // «(Sin registrar)» no es un periodo: en el eje del tiempo no tiene sitio.
    const orden = etiquetas.map((_, k) => k).filter(k => etiquetas[k] !== E.sin_dato);
    return {labels: orden.map(k => etiquetas[k]),
            confirmados: orden.map(k => conf[k]),
            otros: orden.map(k => otros[k])};
  }

  /** Densidad de incidencia por dispositivo, sobre los días registrados.
   *
   * El denominador son los días de exposición que las investigaciones
   * registraron, no el censo de días-dispositivo del hospital: sirve para
   * comparar dispositivos entre sí y consigo mismos en el tiempo, no para
   * publicarse como la tasa oficial. La tarjeta lo dice.
   */
  function dispositivos(filas) {
    const etiquetas = vig.dims.dispositivo;
    const salida = [];
    for (let t = 0; t < etiquetas.length; t++) {
      let casos = 0, dias = 0, si = 0, no = 0;
      for (const i of filas) {
        if (r.dispositivo[t][i] === 1) casos++;
        dias += r.dispositivo_dias[t][i];
        si += r.bundle_si[t][i];
        no += r.bundle_no[t][i];
      }
      if (!casos && !dias) continue;
      salida.push({
        label: etiquetas[t], casos, dias, evaluados: si + no,
        densidad: dias ? casos * 1000 / dias : null,
        bundle: (si + no) ? si / (si + no) : null
      });
    }
    return salida.sort((a, b) => b.casos - a.casos ||
                                 a.label.localeCompare(b.label, 'es'));
  }

  /** Resumen de un intervalo en días. Mediana y no media: la cola es larga. */
  function intervalo(filas, clave) {
    const valores = [];
    for (const i of filas) if (r[clave][i] !== null) valores.push(r[clave][i]);
    if (!valores.length) return {n: 0, mediana: null, p90: null, max: null};
    valores.sort((a, b) => a - b);
    const cuantil = q => valores[Math.min(valores.length - 1,
                                          Math.floor(q * valores.length))];
    return {n: valores.length, mediana: cuantil(0.5), p90: cuantil(0.9),
            max: valores[valores.length - 1]};
  }

  /** Cruce dimensión × dimensión. `multiFila` para las dimensiones matriz. */
  function cruce(filas, claveFila, claveCol, multiFila) {
    const etiquetasFila = vig.dims[claveFila];
    const etiquetasCol = vig.dims[claveCol];
    const celdas = etiquetasFila.map(() => etiquetasCol.map(() => 0));
    for (const i of filas) {
      const c = r[claveCol][i];
      if (multiFila) {
        for (let k = 0; k < etiquetasFila.length; k++) {
          if (r[claveFila][k][i] === 1) celdas[k][c]++;
        }
      } else {
        celdas[r[claveFila][i]][c]++;
      }
    }
    // Fila entera a cero: ocupa alto y no dice nada.
    const vivas = celdas
      .map((fila, k) => ({k, total: fila.reduce((a, b) => a + b, 0)}))
      .filter(e => e.total > 0)
      .sort((a, b) => b.total - a.total);
    return {filas: vivas.map(e => ({label: etiquetasFila[e.k],
                                   valores: celdas[e.k], total: e.total})),
            columnas: etiquetasCol};
  }

  /** Variación del último periodo frente a la media de los anteriores.
   *
   * Un recuento suelto no dice si la cosa va a mejor o a peor, que es lo
   * primero que se pregunta quien abre el tablero.
   */
  function variacion(filas, periodo) {
    const s = serie(filas, periodo);
    if (s.labels.length < 2) return null;
    const ultimo = s.labels.length - 1;
    const previos = s.confirmados.slice(0, ultimo);
    const media = previos.reduce((a, b) => a + b, 0) / previos.length;
    const hoy = new Date();
    const mesActual = hoy.getFullYear() + '-' +
      String(hoy.getMonth() + 1).padStart(2, '0');
    return {
      etiqueta: s.labels[ultimo], valor: s.confirmados[ultimo], media,
      // Un mes a medias siempre parece una caída: hay que decirlo, no
      // esconderlo ni excluirlo.
      enCurso: s.labels[ultimo] === mesActual
    };
  }

  const MS_DIA = 86400000;
  // El día 0 de la época fue jueves; restar (dia+3)%7 cae en su lunes.
  const lunesDe = dia => dia - ((dia + 3) % 7);

  /** Curva epidémica semanal con umbral de media móvil + 2 DE.
   *
   * El eje se construye desde las fechas y no desde `dims.semana`: así las
   * semanas sin ningún caso salen como cero en lugar de desaparecer, que es
   * justo lo que haría que una subida pareciera plana.
   */
  function curva(filas, ventana) {
    const dias = [];
    for (const i of confirmados(filas)) if (r.dia[i] !== null) dias.push(r.dia[i]);
    if (!dias.length) return {semanas: []};
    const inicio = lunesDe(Math.min(...dias));
    const fin = lunesDe(Math.max(...dias));
    const cuenta = new Map();
    for (const d of dias) {
      const k = lunesDe(d);
      cuenta.set(k, (cuenta.get(k) || 0) + 1);
    }
    const semanas = [];
    for (let d = inicio; d <= fin; d += 7) {
      const casos = cuenta.get(d) || 0;
      const base = semanas.slice(-ventana).map(s => s.casos);
      let media = null, umbral = null;
      // Con una o dos semanas detrás, la desviación no significa nada: se
      // deja sin umbral en vez de inventar una línea que nadie puede leer.
      if (base.length >= 3) {
        media = base.reduce((a, b) => a + b, 0) / base.length;
        const varianza = base.reduce((a, b) => a + (b - media) ** 2, 0) / base.length;
        umbral = media + 2 * Math.sqrt(varianza);
      }
      semanas.push({
        dia: d, label: fechaCorta(d), casos, media, umbral,
        alerta: umbral !== null && casos > umbral
      });
    }
    return {semanas};
  }

  const fechaCorta = dia => new Date(dia * MS_DIA)
    .toLocaleDateString('es', {day: '2-digit', month: '2-digit'});
  const fechaLarga = dia => new Date(dia * MS_DIA).toISOString().slice(0, 10);

  /** Conglomerados: mismo servicio y microorganismo en pocos días.
   *
   * No prueba un brote —para eso hace falta tipificación y una investigación
   * de campo—, pero es la señal que hay que mirar antes de que se convierta
   * en uno.
   */
  function conglomerados(filas, ventana, minimo) {
    const servicios = vig.dims.servicio;
    const micros = vig.dims.microorganismo;
    const grupos = new Map();
    for (const i of confirmados(filas)) {
      if (r.dia[i] === null) continue;
      for (let k = 0; k < micros.length; k++) {
        if (r.microorganismo[k][i] !== 1) continue;
        const clave = r.servicio[i] + '|' + k;
        if (!grupos.has(clave)) grupos.set(clave, []);
        grupos.get(clave).push({dia: r.dia[i], fila: i});
      }
    }
    const salida = [];
    for (const [clave, casos] of grupos) {
      if (casos.length < minimo) continue;
      casos.sort((x, y) => x.dia - y.dia);
      // Ventana deslizante: la racha más apretada que alcanza el mínimo.
      let mejor = null;
      for (let a = 0; a < casos.length; a++) {
        let b = a;
        while (b + 1 < casos.length && casos[b + 1].dia - casos[a].dia <= ventana) b++;
        const cuantos = b - a + 1;
        if (cuantos >= minimo && (!mejor || cuantos > mejor.casos)) {
          mejor = {casos: cuantos, desde: casos[a].dia, hasta: casos[b].dia,
                   filas: casos.slice(a, b + 1).map(c => c.fila)};
        }
      }
      if (!mejor) continue;
      const [servicio, k] = clave.split('|');
      salida.push({
        // `clave` identifica al grupo entre repintados: los índices de fila
        // cambian con los filtros, el par servicio-microorganismo no.
        clave, servicio: servicios[servicio], microorganismo: micros[Number(k)],
        casos: mejor.casos, desde: fechaLarga(mejor.desde),
        hasta: fechaLarga(mejor.hasta), filas: mejor.filas,
        dias: mejor.hasta - mejor.desde
      });
    }
    return salida.sort((a, b) => b.casos - a.casos || a.dias - b.dias ||
                                 a.servicio.localeCompare(b.servicio, 'es'));
  }

  /** Detalle de un conglomerado: resumen agregado y cronología de sus casos.
   *
   * La cronología no lleva edad, sexo ni condición. Fecha + ubicación ya
   * señalan a una cama concreta de un pabellón concreto, y esta página es
   * pública: los desenlaces van en el resumen, contados, no fila a fila.
   */
  function detalleConglomerado(grupo) {
    const iFallecido = indiceDe('condicion', 'Fallecido');
    const iPendiente = indiceDe('vigepes', 'Pendiente');
    const iExtra = indiceDe('origen', 'Extrahospitalario');
    let fallecidos = 0, pendientes = 0, importados = 0, abiertas = 0, sinInv = 0;
    const intervalos = [];
    let previo = null;
    const cronologia = [];
    for (const i of grupo.filas) {
      if (r.condicion[i] === iFallecido) fallecidos++;
      if (r.vigepes[i] === iPendiente) pendientes++;
      if (r.origen[i] === iExtra) importados++;
      if (r.investigado[i] !== 1) sinInv++;
      else if (r.cerrado[i] !== 1) abiertas++;
      if (previo !== null) intervalos.push(r.dia[i] - previo);
      previo = r.dia[i];
      cronologia.push({
        fecha: fechaLarga(r.dia[i]),
        ubicacion: vig.dims.ubicacion[r.ubicacion[i]],
        origen: vig.dims.origen[r.origen[i]],
        estancia: r.deteccion[i],
        aInvestigacion: r.a_investigacion[i],
        investigacion: r.investigado[i] !== 1 ? 'Sin registrar'
          : (r.cerrado[i] === 1 ? 'Cerrada' : 'Abierta')
      });
    }
    intervalos.sort((a, b) => a - b);
    const mediana = arr => arr.length
      ? arr[Math.floor(arr.length / 2)] : null;
    const estancias = grupo.filas.map(i => r.deteccion[i])
      .filter(v => v !== null).sort((a, b) => a - b);
    return {
      cronologia,
      resumen: {
        casos: grupo.casos, dias: grupo.dias,
        intervalo: mediana(intervalos), estancia: mediana(estancias),
        fallecidos, pendientes, importados, abiertas, sinInv,
        ubicaciones: new Set(grupo.filas.map(i => r.ubicacion[i])).size
      }
    };
  }

  return {filasActivas, confirmados, kpis, embudo, porDim, porMulti, porDimCon,
          serie, dispositivos, intervalo, cruce, excluidosPorFecha, variacion,
          curva, conglomerados, detalleConglomerado};
}
</script>
<script id="mod-iaas">
/** Agregación del apartado de IAAS.
 *
 * Mide producción: cuántos envíos declararon cada actividad, por quién,
 * dónde y cuándo. Las respuestas SI/NO del formulario no se publican, así
 * que aquí no hay tasas — solo recuentos.
 */
function crearIaas(iaas) {
  const r = iaas.rows;
  const n = iaas.meta.filas;
  const nAct = iaas.actividades.length;

  function filasActivas(f) {
    const out = [];
    for (let i = 0; i < n; i++) {
      if (f.desde !== null && r.dia[i] < f.desde) continue;
      if (f.hasta !== null && r.dia[i] > f.hasta) continue;
      if (f.responsable !== null && r.responsable[i] !== f.responsable) continue;
      if (f.servicio !== null && r.servicio[i] !== f.servicio) continue;
      if (f.actividad !== null && r.actividades[f.actividad][i] !== 1) continue;
      out.push(i);
    }
    return out;
  }

  /** Recuento de envíos que declararon cada actividad. */
  function cuenta(filas) {
    const out = new Array(nAct).fill(0);
    for (const i of filas) {
      for (let a = 0; a < nAct; a++) if (r.actividades[a][i] === 1) out[a]++;
    }
    return out;
  }

  function kpis(filas) {
    return {registros: filas.length, porActividad: cuenta(filas)};
  }

  function porActividad(filas) {
    const c = cuenta(filas);
    return iaas.actividades.map((label, a) => ({
      idx: a, label, registros: c[a], principal: a < iaas.principales
    }));
  }

  function porDim(filas, clave) {
    const etiquetas = iaas.dims[clave];
    const acc = new Map();
    for (const i of filas) {
      const idx = r[clave][i];
      let e = acc.get(idx);
      if (!e) {
        e = {idx, label: etiquetas[idx], registros: 0,
             actividades: new Array(nAct).fill(0)};
        acc.set(idx, e);
      }
      e.registros++;
      for (let a = 0; a < nAct; a++) if (r.actividades[a][i] === 1) e.actividades[a]++;
    }
    const salida = [...acc.values()];
    // Quien más produce, arriba. A igualdad de volumen, orden alfabético
    // para que el listado no baile entre builds.
    salida.sort((a, b) => b.registros - a.registros ||
                          a.label.localeCompare(b.label, 'es'));
    return salida;
  }

  function series(filas, periodo) {
    const etiquetas = iaas.dims[periodo];
    const vol = etiquetas.map(() => 0);
    const porAct = iaas.actividades.map(() => etiquetas.map(() => 0));
    for (const i of filas) {
      const k = r[periodo][i];
      vol[k]++;
      for (let a = 0; a < nAct; a++) if (r.actividades[a][i] === 1) porAct[a][k]++;
    }
    return {labels: etiquetas, volumen: vol, porActividad: porAct};
  }

  return {filasActivas, kpis, porActividad, porDim, series};
}
</script>
<script id="mod-charts">
const charts = (() => {
  const vivos = new Set();
  const tip = document.getElementById('tip');

  function token(nombre) {
    return getComputedStyle(document.documentElement)
      .getPropertyValue('--' + nombre).trim();
  }

  const pct = v => v === null ? '—' : (v * 100).toFixed(1) + '%';
  const num = v => v === null ? '—' : v.toLocaleString('es');

  function destroyAll() {
    vivos.forEach(c => c.destroy());
    vivos.clear();
  }

  /** Destruye los gráficos cuyo canvas cuelga de este contenedor.
   *
   * Los conmutadores que repintan una sola tarjeta — mes/semana, ver todas,
   * ver tabla — no pasan por `views.render()`, así que no llegan a
   * `destroyAll()`. Sin esto, cada clic dejaría una instancia de Chart.js
   * viva atada a un canvas ya desprendido del documento.
   */
  function destroyIn(contenedor) {
    for (const g of [...vivos]) {
      if (contenedor.contains(g.canvas)) {
        g.destroy();
        vivos.delete(g);
      }
    }
  }

  /** Tooltip HTML propio: el valor manda, el nombre de la serie acompaña. */
  function mostrarTip(x, y, filas) {
    tip.replaceChildren();
    for (const f of filas) {
      const linea = document.createElement('div');
      if (f.color) {
        const key = document.createElement('span');
        key.className = 'k';
        key.style.background = f.color;
        linea.appendChild(key);
      }
      const v = document.createElement('span');
      v.className = 'v';
      v.textContent = f.valor;
      linea.appendChild(v);
      if (f.nombre) {
        const nm = document.createElement('span');
        nm.className = 'n';
        nm.textContent = ' ' + f.nombre;
        linea.appendChild(nm);
      }
      tip.appendChild(linea);
    }
    tip.style.display = 'block';
    // Reposicionar tras medir, para no salirse del viewport.
    const caja = tip.getBoundingClientRect();
    const izq = Math.min(x + 14, window.innerWidth - caja.width - 8);
    const arr = Math.min(y + 14, window.innerHeight - caja.height - 8);
    tip.style.left = izq + 'px';
    tip.style.top = arr + 'px';
  }
  function ocultarTip() { tip.style.display = 'none'; }

  const base = () => ({
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    interaction: {mode: 'index', intersect: false},
    plugins: {legend: {display: false}, tooltip: {enabled: false}},
    scales: {
      x: {
        grid: {display: false},
        border: {color: token('axis')},
        ticks: {color: token('text-muted'), font: {family: token('sans'), size: 11}}
      },
      y: {
        grid: {color: token('grid'), lineWidth: 1},
        border: {display: false},
        ticks: {color: token('text-muted'), font: {family: token('sans'), size: 11}}
      }
    }
  });

  function enganchaTip(canvas, grafico, describir) {
    const mover = ev => {
      const puntos = grafico.getElementsAtEventForMode(
        ev, 'index', {intersect: false}, false);
      if (!puntos.length) { ocultarTip(); return; }
      mostrarTip(ev.clientX, ev.clientY, describir(puntos[0].index));
    };
    canvas.addEventListener('pointermove', mover);
    canvas.addEventListener('pointerleave', ocultarTip);
    // El teclado ve lo mismo que el puntero.
    canvas.tabIndex = 0;
    let foco = 0;
    canvas.addEventListener('keydown', ev => {
      if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
      ev.preventDefault();
      const n = grafico.data.labels.length;
      foco = (foco + (ev.key === 'ArrowRight' ? 1 : n - 1)) % n;
      const caja = canvas.getBoundingClientRect();
      mostrarTip(caja.left + caja.width * (foco + 0.5) / n,
                 caja.top + 20, describir(foco));
    });
    canvas.addEventListener('blur', ocultarTip);
  }

  function line(canvas, {labels, series, formato = pct}) {
    const opciones = base();
    if (formato === pct) {
      opciones.scales.y.min = 0;
      opciones.scales.y.max = 1;
      opciones.scales.y.ticks.callback = v => (v * 100) + '%';
    }
    const grafico = new Chart(canvas, {
      type: 'line',
      data: {
        labels,
        datasets: series.map(s => ({
          label: s.label,
          data: s.data,
          borderColor: s.color,
          backgroundColor: s.color,
          borderWidth: s.ancho || 2,
          pointRadius: 4,             // marcador de 8px de diámetro
          pointHoverRadius: 6,
          pointBorderColor: token('surface'),
          pointBorderWidth: 2,        // anillo de superficie
          spanGaps: false,
          tension: 0
        }))
      },
      options: opciones
    });
    vivos.add(grafico);
    enganchaTip(canvas, grafico, i => [
      {valor: labels[i], nombre: ''},
      ...series.map(s => ({
        color: s.color, valor: formato(s.data[i]), nombre: s.label
      }))
    ]);
    return grafico;
  }

  function _barras(canvas, {labels, values, formato, horizontal}) {
    const opciones = base();
    opciones.indexAxis = horizontal ? 'y' : 'x';
    if (horizontal) {
      opciones.scales.x.grid = {color: token('grid'), lineWidth: 1};
      opciones.scales.y.grid = {display: false};
      if (formato === pct) {
        opciones.scales.x.min = 0;
        opciones.scales.x.max = 1;
        opciones.scales.x.ticks.callback = v => (v * 100) + '%';
      }
    } else if (formato === pct) {
      opciones.scales.y.min = 0;
      opciones.scales.y.max = 1;
      opciones.scales.y.ticks.callback = v => (v * 100) + '%';
    }
    const grafico = new Chart(canvas, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          data: values,
          backgroundColor: token('series-1'),
          borderRadius: 4,            // extremo de datos redondeado
          borderSkipped: 'start',     // cuadrado en la línea base
          maxBarThickness: 24,
          // El hueco entre barras lo hace la superficie, no un borde.
          categoryPercentage: 0.82,
          barPercentage: 0.92
        }]
      },
      options: opciones
    });
    vivos.add(grafico);
    return grafico;
  }

  function bars(canvas, cfg) {
    // Chart.js no dibuja nada para null y una barra de ancho cero para 0:
    // sin esto, "cumplió 0 de N" y "no se puede puntuar" se ven idénticos
    // al fondo de un ranking. Se marca en la etiqueta, como ya hace el
    // mapa de calor con el '·'.
    const etiquetas = cfg.labels.map((etiqueta, i) =>
      cfg.values[i] === null ? etiqueta + ' — sin dictamen' : etiqueta);
    const grafico = _barras(canvas, {...cfg, labels: etiquetas, horizontal: true});
    enganchaTip(canvas, grafico, i => [
      {valor: (cfg.formato || pct)(cfg.values[i]), nombre: cfg.labels[i]},
      ...(cfg.extra ? [{valor: cfg.extra[i], nombre: ''}] : [])
    ]);
    return grafico;
  }

  function columns(canvas, cfg) {
    const grafico = _barras(canvas, {...cfg, horizontal: false});
    enganchaTip(canvas, grafico, i => [
      {valor: (cfg.formato || num)(cfg.values[i]), nombre: cfg.labels[i]}
    ]);
    return grafico;
  }

  /** Mapa de calor en CSS Grid. Rampa secuencial de un solo tono. */
  function heat(contenedor, {rowLabels, colLabels, cells}) {
    const pasos = ['seq-100', 'seq-250', 'seq-400', 'seq-550', 'seq-700']
      .map(token);
    contenedor.replaceChildren();
    const reja = document.createElement('div');
    reja.className = 'heat';
    reja.style.gridTemplateColumns =
      `max-content repeat(${colLabels.length}, minmax(52px, 1fr))`;

    reja.appendChild(document.createElement('div'));  // esquina vacía
    for (const c of colLabels) {
      const celda = document.createElement('div');
      celda.className = 'collab';
      celda.style.textAlign = 'center';
      celda.textContent = c;
      reja.appendChild(celda);
    }

    rowLabels.forEach((etiqueta, f) => {
      const lab = document.createElement('div');
      lab.className = 'rowlab';
      lab.textContent = etiqueta;
      reja.appendChild(lab);
      cells[f].forEach((celda, c) => {
        const div = document.createElement('div');
        div.className = 'cell';
        if (celda.total === 0 || celda.tasa === null) {
          div.style.background = 'transparent';
          div.style.color = token('text-muted');
          div.textContent = '·';
        } else {
          const paso = Math.min(4, Math.floor(celda.tasa * 5));
          div.style.background = pasos[paso];
          // Blanco o tinta según la luminancia del relleno, para que la
          // etiqueta siempre tenga contraste.
          div.style.color = paso >= 3 ? '#ffffff' : '#0b0b0b';
          div.textContent = (celda.tasa * 100).toFixed(0);
        }
        div.tabIndex = 0;
        const describir = ev => mostrarTip(
          ev.clientX || div.getBoundingClientRect().left,
          ev.clientY || div.getBoundingClientRect().top,
          [{valor: pct(celda.tasa), nombre: `${etiqueta} · ${colLabels[c]}`},
           {valor: num(celda.total), nombre: 'supervisiones'}]);
        div.addEventListener('pointermove', describir);
        div.addEventListener('focus', describir);
        div.addEventListener('pointerleave', ocultarTip);
        div.addEventListener('blur', ocultarTip);
        reja.appendChild(div);
      });
    });
    contenedor.appendChild(reja);
  }

  /** Tabla ordenable: la vista equivalente que acompaña a cada gráfico.
   *
   * El estado viaja como cuarto argumento en lugar de vivir en el `<th>`:
   * cada reordenación redibuja la cabecera entera, así que un `dataset`
   * sobre la celda se destruiría en el acto y el sentido descendente sería
   * inalcanzable.
   *
   * `opciones.onFila` recibe la **fila entera**, no su posición. Ordenar
   * reconstruye el `<tbody>`, de modo que un índice posicional apuntaría al
   * registro equivocado en cuanto el usuario tocara una cabecera. Quien
   * llama puede añadir a la fila columnas que no se pintan — `columnas`
   * decide qué se muestra — y usarlas como identificador.
   */
  function tabla(contenedor, columnas, filas, opciones) {
    opciones = opciones || {};
    const orden = opciones.orden || {col: null, asc: true};
    const onFila = opciones.onFila || null;
    // Array de celdas, una por columna. Vive en el <tfoot>: no se ordena con
    // el resto ni responde a onFila, porque no es un registro más.
    const total = opciones.total || null;
    contenedor.replaceChildren();

    // Se ordena una copia: `filas` pertenece a quien llama, que puede estar
    // usando el mismo array para alimentar un gráfico.
    const visibles = orden.col === null ? filas : filas.slice().sort((a, b) => {
      const x = a[orden.col], y = b[orden.col];
      // Los vacíos van al final en los dos sentidos, igual que en
      // `agg.rateBy`: no son los peores, son los que no se pueden puntuar.
      const xVacio = x === null || x === undefined;
      const yVacio = y === null || y === undefined;
      if (xVacio && yVacio) return 0;
      if (xVacio) return 1;
      if (yVacio) return -1;
      const cmp = typeof x === 'number' && typeof y === 'number'
        ? x - y : String(x).localeCompare(String(y), 'es');
      return orden.asc ? cmp : -cmp;
    });

    const envoltura = document.createElement('div');
    envoltura.className = 'scroll-x';
    const t = document.createElement('table');
    const thead = document.createElement('thead');
    const trh = document.createElement('tr');
    columnas.forEach((col, i) => {
      const th = document.createElement('th');
      if (col.num) th.className = 'num';
      th.textContent = col.titulo;
      if (orden.col === i) th.textContent += orden.asc ? ' ↑' : ' ↓';
      th.addEventListener('click', () => {
        tabla(contenedor, columnas, filas, {
          orden: {col: i, asc: orden.col === i ? !orden.asc : true},
          onFila, total
        });
      });
      trh.appendChild(th);
    });
    thead.appendChild(trh);
    t.appendChild(thead);
    const tbody = document.createElement('tbody');
    for (const fila of visibles) {
      const tr = document.createElement('tr');
      columnas.forEach((col, i) => {
        const td = document.createElement('td');
        if (col.num) td.className = 'num';
        const bruto = fila[i];
        td.textContent = col.formato ? col.formato(bruto)
          : (bruto === null || bruto === undefined ? '—' : bruto);
        tr.appendChild(td);
      });
      if (onFila) {
        tr.style.cursor = 'pointer';
        tr.addEventListener('click', () => onFila(fila));
      }
      tbody.appendChild(tr);
    }
    t.appendChild(tbody);
    if (total) {
      const tfoot = document.createElement('tfoot');
      const tr = document.createElement('tr');
      columnas.forEach((col, i) => {
        const td = document.createElement('td');
        if (col.num) td.className = 'num';
        const bruto = total[i];
        td.textContent = bruto === undefined ? ''
          : (col.formato ? col.formato(bruto) : bruto);
        tr.appendChild(td);
      });
      tfoot.appendChild(tr);
      t.appendChild(tfoot);
    }
    envoltura.appendChild(t);
    contenedor.appendChild(envoltura);
  }

  return {line, bars, columns, heat, tabla, destroyAll, destroyIn,
          token, pct, num};
})();
</script>
<script id="mod-views">
const views = (() => {
  const estado = {vista: 'global', responsable: null, formulario: null,
                 // Conglomerado abierto en la pestaña de vigilancia.
                 conglomerado: null};
  const contenedor = document.getElementById('view');
  // Null cuando su fuente falló: cada render pinta el aviso en su lugar. Son
  // dos fuentes distintas y fallan por separado: el formulario de Kobo puede
  // estar caído con el libro de vigilancia entero, y al revés.
  const iaas = DATA.iaas.ok ? crearIaas(DATA.iaas) : null;
  const vigilancia = DATA.vigilancia.ok ? crearVigilancia(DATA.vigilancia) : null;

  /** Card con título y, opcionalmente, un botón que alterna gráfico/tabla. */
  function card(titulo, subtitulo) {
    const div = document.createElement('div');
    div.className = 'card';
    const h = document.createElement('h2');
    h.textContent = titulo;
    div.appendChild(h);
    if (subtitulo) {
      const s = document.createElement('div');
      s.className = 'sub';
      s.textContent = subtitulo;
      div.appendChild(s);
    }
    return div;
  }

  /** Zona de contenido dentro de un card.
   *
   * charts.tabla() hace replaceChildren() sobre su contenedor, así que
   * pasarle el card directamente borraría su <h2>. Siempre se le pasa una
   * zona propia.
   */
  function zonaDe(tarjeta) {
    const zona = document.createElement('div');
    tarjeta.appendChild(zona);
    return zona;
  }

  /** Añade a `tarjeta` un gráfico y un botón que lo alterna con su tabla.
   *
   * `columnas` y `filas` aceptan tanto un valor como una función sin
   * argumentos, que se evalúa en cada repintado. Las tarjetas con estado
   * propio —el conmutador mes/semana, el botón "Ver todas"— pasan funciones y
   * llaman al `pintar` devuelto en vez de repintar por su cuenta: así el modo
   * tabla sobrevive a esos cambios en lugar de volver al gráfico.
   */
  function conTabla(tarjeta, columnas, filas, dibujarGrafico) {
    const zona = zonaDe(tarjeta);
    const boton = document.createElement('button');
    boton.className = 'chip';
    boton.type = 'button';
    boton.style.marginTop = '10px';
    let mostrandoTabla = false;
    const valor = x => typeof x === 'function' ? x() : x;
    const pintar = () => {
      // Este conmutador repinta solo su tarjeta y no pasa por render(),
      // así que destruye sus propios gráficos o los va acumulando.
      charts.destroyIn(zona);
      zona.replaceChildren();
      if (mostrandoTabla) charts.tabla(zona, valor(columnas), valor(filas));
      else dibujarGrafico(zona);
      boton.textContent = mostrandoTabla ? 'Ver gráfico' : 'Ver tabla';
    };
    boton.addEventListener('click', () => { mostrandoTabla = !mostrandoTabla; pintar(); });
    tarjeta.appendChild(boton);
    pintar();
    return pintar;
  }

  function plot(zona, id) {
    const caja = document.createElement('div');
    caja.className = 'plot';
    const lienzo = document.createElement('canvas');
    lienzo.id = id;
    caja.appendChild(lienzo);
    zona.appendChild(caja);
    return lienzo;
  }

  function vacio(mensaje) {
    const div = document.createElement('div');
    div.className = 'empty';
    div.textContent = mensaje;
    return div;
  }

  function kpi(etiqueta, valor, delta) {
    const div = document.createElement('div');
    div.className = 'kpi';
    const l = document.createElement('div');
    l.className = 'label';
    l.textContent = etiqueta;
    const v = document.createElement('div');
    v.className = 'value';
    v.textContent = valor;
    div.append(l, v);
    if (delta) {
      const d = document.createElement('div');
      d.className = 'delta';
      d.textContent = delta;
      div.appendChild(d);
    }
    return div;
  }

  function render() {
    charts.destroyAll();
    contenedor.replaceChildren();
    // Las vistas de IAAS tienen su propia fuente y sus propios filtros: no
    // pasan por store.activeRows().
    if (estado.vista === 'iaas') { renderIaas(); return; }
    if (estado.vista === 'vigilancia') { renderVigilancia(); return; }
    const filas = store.activeRows();
    if (!filas.length) {
      contenedor.appendChild(vacio('Sin registros para estos filtros.'));
      return;
    }
    if (estado.vista === 'global') renderGlobal(filas);
    else if (estado.vista === 'responsable') renderResponsable(filas);
    else renderFormulario(filas);
  }

  // renderGlobal, renderResponsable y renderFormulario se añaden en las
  // tasks 10, 11 y 12. Hasta entonces son marcadores visibles.
  function renderGlobal(filas) {
    const k = agg.kpis(filas);

    const fila = document.createElement('div');
    fila.className = 'kpis';
    fila.style.marginBottom = '16px';
    fila.append(
      kpi('Supervisiones', charts.num(k.total)),
      kpi('Tasa de cumplimiento', charts.pct(k.tasa),
          `${charts.num(k.conDictamen)} con dictamen · ${charts.num(k.sinDictamen)} sin dictamen`),
      kpi('Responsables activos', charts.num(k.responsables)),
      kpi('Formularios usados', charts.num(k.formularios)),
      kpi('Aprobados', charts.pct(k.tasaAprobado), charts.num(k.aprobados) + ' registros')
    );
    contenedor.appendChild(fila);

    // Ranking de responsables. Categorías nominales: un solo color para todas
    // las barras. La longitud ya codifica la magnitud; teñirlas por rango
    // duplicaría la codificación y quemaría el canal de color.
    const porResp = agg.rateBy(filas, 'responsable');
    const tarjetaResp = card(
      'Cumplimiento por responsable',
      'Ordenado por tasa. El número entre paréntesis es el volumen de supervisiones.');
    conTabla(
      tarjetaResp,
      [{titulo: 'Responsable'}, {titulo: 'Supervisiones', num: true},
       {titulo: 'Cumplen', num: true}, {titulo: 'No cumplen', num: true},
       {titulo: 'Sin dictamen', num: true},
       {titulo: 'Tasa', num: true, formato: charts.pct}],
      porResp.map(e => [e.label, e.total, e.si, e.no, e.sin, e.tasa]),
      zona => {
        const caja = document.createElement('div');
        caja.className = 'plot';
        caja.style.height = Math.max(200, porResp.length * 26 + 40) + 'px';
        const lienzo = document.createElement('canvas');
        caja.appendChild(lienzo);
        zona.appendChild(caja);
        const grafico = charts.bars(lienzo, {
          labels: porResp.map(e => `${e.label} (${e.total})`),
          values: porResp.map(e => e.tasa),
          extra: porResp.map(e => `${e.si} de ${e.si + e.no} con dictamen`),
          formato: charts.pct
        });
        lienzo.style.cursor = 'pointer';
        lienzo.addEventListener('click', ev => {
          const puntos = grafico.getElementsAtEventForMode(
            ev, 'index', {intersect: false}, false);
          if (puntos.length) views.irA('responsable', porResp[puntos[0].index].idx);
        });
      });
    contenedor.appendChild(tarjetaResp);

    // Evolución: dos plots apilados sobre el mismo eje X. Nunca un eje Y
    // secundario — ver Global Constraints.
    const s = agg.series(filas, 'mes');
    const rejilla = document.createElement('div');
    rejilla.className = 'grid-2';

    const tTasa = card('Tasa de cumplimiento por mes', null);
    conTabla(tTasa,
      [{titulo: 'Mes'}, {titulo: 'Tasa', num: true, formato: charts.pct}],
      s.labels.map((l, i) => [l, s.tasa[i]]),
      zona => charts.line(plot(zona, 'g-tasa'), {
        labels: s.labels,
        series: [{label: 'Tasa de cumplimiento', data: s.tasa,
                  color: charts.token('series-1')}]
      }));

    const tVol = card('Supervisiones por mes', null);
    conTabla(tVol,
      [{titulo: 'Mes'}, {titulo: 'Supervisiones', num: true}],
      s.labels.map((l, i) => [l, s.volumen[i]]),
      zona => charts.columns(plot(zona, 'g-vol'), {
        labels: s.labels, values: s.volumen, formato: charts.num
      }));

    rejilla.append(tTasa, tVol);
    contenedor.appendChild(rejilla);

    // Mapa de calor: magnitud continua, rampa secuencial de un solo tono.
    const calor = agg.heatmap(filas, 'submedida', 'mes');
    const tCalor = card('Cumplimiento por submedida y mes',
                        'Porcentaje de cumplimiento. Un punto marca que no hubo registros con dictamen.');
    conTabla(tCalor,
      [{titulo: 'Submedida'}, {titulo: 'Mes'},
       {titulo: 'Tasa', num: true, formato: charts.pct},
       {titulo: 'Supervisiones', num: true}],
      calor.rowLabels.flatMap((f, i) =>
        calor.colLabels.map((c, j) => [f, c, calor.cells[i][j].tasa, calor.cells[i][j].total])),
      zona => charts.heat(zona, calor));
    contenedor.appendChild(tCalor);
  }
  const DIMENSIONES_DESGLOSE = [
    ['medida', 'Medida'],
    ['submedida', 'Submedida'],
    ['unidad', 'Unidad / servicio'],
    ['area', 'Área específica'],
    ['grupo', 'Grupo ocupacional'],
    ['cargo', 'Cargo']
  ];
  const TOPE_BARRAS = 15;

  function selectorResponsable() {
    const label = document.createElement('label');
    label.style.cssText = 'display:flex;flex-direction:column;font-size:12px;gap:3px';
    label.textContent = 'Responsable';
    const sel = document.createElement('select');
    sel.style.cssText = 'font:inherit;font-size:14px;padding:6px 9px;border-radius:7px;' +
      'border:1px solid var(--border);background:var(--surface);color:var(--text-primary)';
    DATA.dims.responsable.forEach((nombre, i) => {
      const op = document.createElement('option');
      op.value = String(i);
      op.textContent = nombre;
      if (i === estado.responsable) op.selected = true;
      sel.appendChild(op);
    });
    sel.addEventListener('change', () => {
      estado.responsable = Number(sel.value);
      render();
    });
    label.appendChild(sel);
    return label;
  }

  function renderResponsable(filas) {
    if (estado.responsable === null) estado.responsable = 0;
    const suyas = filas.filter(i => DATA.rows.responsable[i] === estado.responsable);

    const cabecera = document.createElement('div');
    cabecera.style.cssText = 'display:flex;gap:16px;align-items:flex-end;margin-bottom:16px';
    cabecera.appendChild(selectorResponsable());
    contenedor.appendChild(cabecera);

    if (!suyas.length) {
      contenedor.appendChild(
        vacio('Este responsable no tiene registros para estos filtros.'));
      return;
    }

    const k = agg.kpis(suyas);
    const global = agg.kpis(filas);
    const delta = (a, b) => {
      if (a === null || b === null) return '';
      const d = (a - b) * 100;
      const signo = d >= 0 ? '+' : '−';
      return `${signo}${Math.abs(d).toFixed(1)} pts vs. el conjunto filtrado`;
    };

    const fila = document.createElement('div');
    fila.className = 'kpis';
    fila.style.marginBottom = '16px';
    fila.append(
      kpi('Supervisiones', charts.num(k.total),
          `${(k.total / global.total * 100).toFixed(1)}% del total filtrado`),
      kpi('Tasa de cumplimiento', charts.pct(k.tasa), delta(k.tasa, global.tasa)),
      kpi('Sin dictamen', charts.num(k.sinDictamen)),
      kpi('Formularios distintos', charts.num(k.formularios)),
      kpi('Aprobados', charts.pct(k.tasaAprobado), delta(k.tasaAprobado, global.tasaAprobado))
    );
    contenedor.appendChild(fila);

    // Volumen, con conmutador mes / semana.
    const tVol = card('Formularios realizados', null);
    let periodo = 'mes';
    const conmutador = document.createElement('div');
    conmutador.style.margin = '8px 0';
    // Antes de crear la zona: conTabla la añade al final de la tarjeta y el
    // conmutador tiene que quedar por encima del gráfico.
    tVol.appendChild(conmutador);
    const serieVol = () => agg.series(suyas, periodo);
    const repintarVol = conTabla(tVol,
      () => [{titulo: periodo === 'mes' ? 'Mes' : 'Semana'},
             {titulo: 'Supervisiones', num: true, formato: charts.num}],
      () => {
        const s = serieVol();
        return s.labels.map((l, i) => [l, s.volumen[i]]);
      },
      zona => {
        const s = serieVol();
        charts.columns(plot(zona, 'r-vol'),
                       {labels: s.labels, values: s.volumen, formato: charts.num});
      });
    [['mes', 'Por mes'], ['semana', 'Por semana']].forEach(([valor, texto]) => {
      const b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.textContent = texto;
      b.addEventListener('click', () => { periodo = valor; repintarVol(); });
      conmutador.appendChild(b);
    });
    contenedor.appendChild(tVol);

    // Evolución con emphasis: la persona en color, el conjunto en gris.
    const suya = agg.series(suyas, 'mes');
    const todaGlobal = agg.series(filas, 'mes');
    const mapaGlobal = new Map(todaGlobal.labels.map((l, i) => [l, todaGlobal.tasa[i]]));
    const tEvo = card('Evolución de su cumplimiento',
                      'La línea gris es el conjunto filtrado completo, como referencia.');
    conTabla(tEvo,
      [{titulo: 'Mes'}, {titulo: 'Su tasa', num: true, formato: charts.pct},
       {titulo: 'Conjunto', num: true, formato: charts.pct}],
      suya.labels.map((l, i) => [l, suya.tasa[i], mapaGlobal.get(l) ?? null]),
      zona => charts.line(plot(zona, 'r-evo'), {
        labels: suya.labels,
        series: [
          {label: 'Conjunto filtrado',
           data: suya.labels.map(l => mapaGlobal.get(l) ?? null),
           color: charts.token('context')},
          {label: DATA.dims.responsable[estado.responsable],
           data: suya.tasa, color: charts.token('series-1')}
        ]
      }));
    contenedor.appendChild(tEvo);

    // Desglose en las seis dimensiones.
    const rejilla = document.createElement('div');
    rejilla.className = 'grid-2';
    for (const [clave, titulo] of DIMENSIONES_DESGLOSE) {
      const datos = agg.rateBy(suyas, clave);
      const recortado = datos.length > TOPE_BARRAS;
      let mostrando = recortado ? TOPE_BARRAS : datos.length;
      const tarjeta = card(titulo,
        recortado ? `${datos.length} valores; se muestran los ${TOPE_BARRAS} primeros.` : null);
      const vistaDe = () => datos.slice(0, mostrando);
      const pintar = conTabla(tarjeta,
        [{titulo}, {titulo: 'Supervisiones', num: true, formato: charts.num},
         {titulo: 'Tasa', num: true, formato: charts.pct}],
        () => vistaDe().map(e => [e.label, e.total, e.tasa]),
        zona => {
          const vista = vistaDe();
          const caja = document.createElement('div');
          caja.className = 'plot';
          caja.style.height = Math.max(140, vista.length * 24 + 40) + 'px';
          const lienzo = document.createElement('canvas');
          caja.appendChild(lienzo);
          zona.appendChild(caja);
          charts.bars(lienzo, {
            labels: vista.map(e => `${e.label} (${e.total})`),
            values: vista.map(e => e.tasa),
            extra: vista.map(e => `${e.si} de ${e.si + e.no} con dictamen`),
            formato: charts.pct
          });
        });
      if (recortado) {
        const ver = document.createElement('button');
        ver.className = 'chip';
        ver.type = 'button';
        ver.style.marginTop = '8px';
        ver.textContent = 'Ver todas';
        ver.addEventListener('click', () => {
          mostrando = mostrando === datos.length ? TOPE_BARRAS : datos.length;
          ver.textContent = mostrando === datos.length ? 'Ver menos' : 'Ver todas';
          pintar();
        });
        tarjeta.appendChild(ver);
      }
      rejilla.appendChild(tarjeta);
    }
    contenedor.appendChild(rejilla);

    // Sus formularios, enlazados a la vista de formulario.
    const porForm = agg.rateBy(suyas, 'formulario');
    const tForm = card('Sus formularios', 'Pulse una fila para ver el detalle del formulario.');
    // El índice del formulario viaja como cuarta posición de la fila. `columnas`
    // solo declara tres, así que no se pinta; y al viajar con la fila sobrevive
    // a que el usuario reordene la tabla, cosa que un índice posicional no hace.
    const sumaForm = agg.totalDe(porForm);
    charts.tabla(zonaDe(tForm),
      [{titulo: 'Formulario'}, {titulo: 'Supervisiones', num: true},
       {titulo: 'Tasa', num: true, formato: charts.pct}],
      porForm.map(e => [DATA.forms[e.label].nombre, e.total, e.tasa, e.idx]),
      {onFila: fila => irA('formulario', fila[3]),
       // La tasa es ponderada, así que coincide con el KPI de cumplimiento
       // de esta misma vista.
       // Valores en bruto: el <tfoot> aplica el formato de cada columna,
       // igual que a las filas del cuerpo.
       total: [`Total (${sumaForm.n} ${sumaForm.n === 1 ? 'formulario' : 'formularios'})`,
               sumaForm.total, sumaForm.tasa]});
    contenedor.appendChild(tForm);
  }

  /** «CASOS NUEVOS INVESTIGADOS» -> «Casos nuevos investigados».
   *
   * Kobo guarda las actividades en mayúsculas; en un KPI o una cabecera de
   * tabla eso grita y además ocupa más de lo que cabe.
   */
  const TITULO_ACTIVIDAD = etiqueta =>
    etiqueta.charAt(0) + etiqueta.slice(1).toLowerCase();

  /** Recuento de casos confirmados por dimensión, solo con el filtro de fechas.
   *
   * Los otros filtros de la pestaña —responsable, servicio, actividad— son del
   * formulario de producción y no existen en el de casos. Aplicarlos aquí daría
   * un número que no significa nada, así que las tarjetas de casos lo dicen en
   * vez de fingir que están filtradas.
   */
  function casosPorDim(casos, clave, f) {
    const r = casos.rows;
    const cuenta = new Map();
    let total = 0;
    for (let i = 0; i < r.dia.length; i++) {
      if (f.desde !== null && r.dia[i] < f.desde) continue;
      if (f.hasta !== null && r.dia[i] > f.hasta) continue;
      total++;
      const k = r[clave][i];
      cuenta.set(k, (cuenta.get(k) || 0) + 1);
    }
    const filas = [...cuenta].map(([k, n]) => ({label: casos.dims[clave][k], casos: n}));
    // Más casos arriba; a igualdad, alfabético para que no baile entre builds.
    filas.sort((a, b) => b.casos - a.casos || a.label.localeCompare(b.label, 'es'));
    return {filas, total};
  }

  /** Tarjeta de casos confirmados por área, con gráfico y tabla. */
  function tarjetaCasos(titulo, subtitulo, datos) {
    const tarjeta = card(titulo, subtitulo);
    conTabla(tarjeta,
      [{titulo: 'Área'}, {titulo: 'Casos', num: true, formato: charts.num}],
      datos.map(e => [e.label, e.casos]),
      zona => {
        const caja = document.createElement('div');
        caja.className = 'plot';
        caja.style.height = Math.max(140, datos.length * 26 + 40) + 'px';
        const lienzo = document.createElement('canvas');
        caja.appendChild(lienzo);
        zona.appendChild(caja);
        charts.bars(lienzo, {
          labels: datos.map(e => e.label),
          values: datos.map(e => e.casos),
          formato: charts.num
        });
      });
    return tarjeta;
  }

  /** Casos de IAAS confirmados, por unidad y por subservicio.
   *
   * Fuente distinta a la de producción —otro formulario de Kobo—, así que se
   * pinta antes y aparte: si el de producción falla, esto se sigue viendo.
   */
  function renderCasos() {
    const casos = DATA.iaas.casos;
    if (!casos) return;
    if (!casos.ok) {
      contenedor.appendChild(vacio(
        'Casos confirmados no disponibles: ' + casos.error +
        (casos.fecha ? ' (último intento: ' + casos.fecha + ')' : '')));
      return;
    }
    const f = storeIaas.filters;
    const unidades = casosPorDim(casos, 'unidad', f);
    const sub = casosPorDim(casos, 'subservicio', f);

    const fila = document.createElement('div');
    fila.className = 'kpis';
    fila.style.marginBottom = '16px';
    fila.appendChild(kpi('IAAS confirmadas', charts.num(unidades.total)));
    fila.appendChild(kpi('Unidades con casos', charts.num(unidades.filas.length)));
    contenedor.appendChild(fila);

    const nota = document.createElement('div');
    nota.className = 'sub';
    nota.style.marginBottom = '16px';
    nota.textContent = 'Casos con «Definición de caso: Confirmado», por la ' +
      'ubicación del paciente. Solo el rango de fechas filtra estas tarjetas: ' +
      'responsable, servicio y actividad son del formulario de producción.';
    contenedor.appendChild(nota);

    if (!unidades.total) {
      contenedor.appendChild(vacio('Sin casos confirmados en este rango de fechas.'));
      return;
    }
    contenedor.appendChild(tarjetaCasos(
      'IAAS confirmadas por unidad', 'Unidad o servicio donde está el paciente.',
      unidades.filas));
    contenedor.appendChild(tarjetaCasos(
      'IAAS confirmadas por subservicio', 'El segundo nivel del área.',
      sub.filas));
  }

  function renderIaas() {
    renderCasos();
    if (!DATA.iaas.ok) {
      // La pestaña sigue existiendo y dice por qué no hay datos: si
      // desapareciera, un fallo de Kobo pasaría por "aquí nunca hubo nada".
      contenedor.appendChild(vacio(
        'Datos de Kobo no disponibles: ' + DATA.iaas.error +
        (DATA.iaas.fecha ? ' (último intento: ' + DATA.iaas.fecha + ')' : '')));
      return;
    }
    const filas = iaas.filasActivas(storeIaas.filters);
    if (!filas.length) {
      contenedor.appendChild(vacio('Sin registros para estos filtros.'));
      return;
    }
    const acts = DATA.iaas.actividades;
    const nPrin = DATA.iaas.principales;
    const k = iaas.kpis(filas);

    // Las tres principales, cada una con su KPI. Las demás se monitorean más
    // abajo: siguen visibles, pero no compiten por la primera pantalla.
    const fila = document.createElement('div');
    fila.className = 'kpis';
    fila.style.marginBottom = '16px';
    fila.appendChild(kpi('Registros', charts.num(k.registros)));
    for (let a = 0; a < nPrin; a++) {
      fila.appendChild(kpi(TITULO_ACTIVIDAD(acts[a]),
                           charts.num(k.porActividad[a])));
    }
    contenedor.appendChild(fila);

    // Los pacientes distintos no son filtrables: contarlos por filtro
    // exigiría publicar un identificador por fila, y fecha + servicio +
    // responsable basta para reidentificar a alguien. Solo el total.
    const nota = document.createElement('div');
    nota.className = 'sub';
    nota.style.marginBottom = '16px';
    nota.textContent = 'Sobre el periodo completo: ' +
      charts.num(DATA.iaas.meta.pacientes) + ' pacientes distintos.';
    contenedor.appendChild(nota);

    const porAct = iaas.porActividad(filas);
    const tAct = card('Producción por actividad',
                      'Cuántos registros declararon cada actividad.');
    conTabla(tAct,
      [{titulo: 'Actividad'}, {titulo: 'Registros', num: true, formato: charts.num}],
      porAct.map(e => [e.label, e.registros]),
      zona => {
        const caja = document.createElement('div');
        caja.className = 'plot';
        caja.style.height = Math.max(140, porAct.length * 26 + 40) + 'px';
        const lienzo = document.createElement('canvas');
        caja.appendChild(lienzo);
        zona.appendChild(caja);
        charts.bars(lienzo, {
          labels: porAct.map(e => e.label),
          values: porAct.map(e => e.registros),
          formato: charts.num
        });
      });
    contenedor.appendChild(tAct);

    // Cuántos casos nuevos aporta cada servicio. La tabla «Por servicio» ya
    // trae la columna, pero mezclada con el resto de actividades; aquí va
    // sola y ordenada por ella, que es la pregunta que se hace de verdad:
    // de dónde salen los casos.
    const NUEVOS = 0;  // «CASOS NUEVOS INVESTIGADOS», la primera principal.
    const nuevosPorServicio = iaas.porDim(filas, 'servicio')
      .map(e => ({label: e.label, casos: e.actividades[NUEVOS]}))
      // Un servicio con cero casos nuevos no dice nada aquí y alarga la
      // barra vertical: se queda en la tabla «Por servicio», que sí los lista.
      .filter(e => e.casos > 0)
      .sort((a, b) => b.casos - a.casos || a.label.localeCompare(b.label, 'es'));
    if (nuevosPorServicio.length) {
      const tNuevos = card(TITULO_ACTIVIDAD(acts[NUEVOS]) + ' por servicio',
                           'Servicios sin casos nuevos en el periodo no aparecen.');
      conTabla(tNuevos,
        [{titulo: 'Servicio'}, {titulo: 'Casos', num: true, formato: charts.num}],
        nuevosPorServicio.map(e => [e.label, e.casos]),
        zona => {
          const caja = document.createElement('div');
          caja.className = 'plot';
          caja.style.height = Math.max(140, nuevosPorServicio.length * 26 + 40) + 'px';
          const lienzo = document.createElement('canvas');
          caja.appendChild(lienzo);
          zona.appendChild(caja);
          charts.bars(lienzo, {
            labels: nuevosPorServicio.map(e => e.label),
            values: nuevosPorServicio.map(e => e.casos),
            formato: charts.num
          });
        });
      contenedor.appendChild(tNuevos);
    }

    // Evolución mensual: una línea por actividad principal. Es la tarjeta
    // que responde "¿esto sube o baja?".
    const s = iaas.series(filas, 'mes');
    const tEvo = card('Evolución mensual',
                      'Las tres actividades principales, mes a mes.');
    const columnas = [{titulo: 'Mes'}];
    for (let a = 0; a < nPrin; a++) {
      columnas.push({titulo: TITULO_ACTIVIDAD(acts[a]), num: true,
                     formato: charts.num});
    }
    conTabla(tEvo, columnas,
      s.labels.map((l, i) => {
        const f = [l];
        for (let a = 0; a < nPrin; a++) f.push(s.porActividad[a][i]);
        return f;
      }),
      zona => charts.line(plot(zona, 'i-evo'), {
        labels: s.labels,
        formato: charts.num,
        series: acts.slice(0, nPrin).map((label, a) => ({
          label,
          data: s.porActividad[a],
          color: charts.token('series-' + (a + 1))
        }))
      }));
    contenedor.appendChild(tEvo);

    for (const [clave, titulo] of [['responsable', 'Por responsable'],
                                   ['servicio', 'Por servicio']]) {
      const datos = iaas.porDim(filas, clave);
      const tarjeta = card(titulo, null);
      const cols = [{titulo: clave === 'responsable' ? 'Responsable' : 'Servicio'},
                    {titulo: 'Registros', num: true, formato: charts.num}];
      for (let a = 0; a < nPrin; a++) {
        cols.push({titulo: TITULO_ACTIVIDAD(acts[a]), num: true,
                   formato: charts.num});
      }
      const total = ['Total (' + datos.length + ')',
                     datos.reduce((x, e) => x + e.registros, 0)];
      for (let a = 0; a < nPrin; a++) {
        total.push(datos.reduce((x, e) => x + e.actividades[a], 0));
      }
      charts.tabla(zonaDe(tarjeta), cols,
        datos.map(e => [e.label, e.registros,
                        ...e.actividades.slice(0, nPrin)]),
        {total});
      contenedor.appendChild(tarjeta);
    }

    // Las actividades secundarias, por responsable: se monitorean, pero
    // aparte de las tres que mandan.
    const secundarias = acts.slice(nPrin);
    if (secundarias.length) {
      const datos = iaas.porDim(filas, 'responsable');
      const tOtras = card('Otras actividades',
                          'Se monitorean, pero no son las principales.');
      const cols = [{titulo: 'Responsable'}];
      secundarias.forEach(label => cols.push({titulo: TITULO_ACTIVIDAD(label),
                                              num: true, formato: charts.num}));
      const total = ['Total (' + datos.length + ')'];
      secundarias.forEach((_, j) => total.push(
        datos.reduce((x, e) => x + e.actividades[nPrin + j], 0)));
      charts.tabla(zonaDe(tOtras), cols,
        datos.map(e => [e.label, ...e.actividades.slice(nPrin)]),
        {total});
      contenedor.appendChild(tOtras);
    }
  }

  /** Barras horizontales dentro de una zona, altas según cuántas filas hay. */
  function barrasEn(zona, datos, valores, formato) {
    const caja = document.createElement('div');
    caja.className = 'plot';
    caja.style.height = Math.max(140, datos.length * 26 + 40) + 'px';
    const lienzo = document.createElement('canvas');
    caja.appendChild(lienzo);
    zona.appendChild(caja);
    charts.bars(lienzo, {labels: datos.map(e => e.label),
                        values: valores || datos.map(e => e.casos),
                        formato: formato || charts.num});
  }

  /** Tarjeta de ranking: gráfico de barras y su tabla equivalente. */
  function tarjetaRanking(titulo, subtitulo, datos, tituloDim) {
    const tarjeta = card(titulo, subtitulo);
    if (!datos.length) {
      tarjeta.appendChild(vacio('Sin datos para estos filtros.'));
      return tarjeta;
    }
    conTabla(tarjeta,
      [{titulo: tituloDim}, {titulo: 'Casos', num: true, formato: charts.num}],
      datos.map(e => [e.label, e.casos]),
      zona => barrasEn(zona, datos));
    return tarjeta;
  }

  /** Tarjeta de solo tabla, para lo que no gana nada dibujado.
   *
   * `onFila` recibe la fila entera —no su posición—, que es lo que sobrevive
   * a reordenar la tabla, y puede llevar columnas que no se pintan.
   */
  function tarjetaTabla(titulo, subtitulo, columnas, filas, total, onFila) {
    const tarjeta = card(titulo, subtitulo);
    if (!filas.length) {
      tarjeta.appendChild(vacio('Sin datos para estos filtros.'));
      return tarjeta;
    }
    const opciones = {};
    if (total) opciones.total = total;
    if (onFila) opciones.onFila = onFila;
    charts.tabla(zonaDe(tarjeta), columnas, filas, opciones);
    return tarjeta;
  }

  const dias = v => v === null ? '—' : charts.num(v) + ' d';
  const decimales = v => v === null ? '—' : v.toFixed(2);

  // Un conglomerado es una señal, no un diagnóstico: los umbrales son los que
  // usa vigilancia para decidir a qué mirar, no una definición de brote.
  const VENTANA_CONGLOMERADO = 14;
  const MINIMO_CONGLOMERADO = 3;
  // Seis semanas de historia para el umbral: menos lo hace saltar con
  // cualquier racha, más tarda en reaccionar a un cambio real.
  const VENTANA_UMBRAL = 6;

  /** Columnas del CSV. Son las mismas que ya se publican en el HTML: la
   *  descarga no puede sacar nada que la pestaña no enseñe. */
  const COLUMNAS_CSV = [
    ['fecha', 'Fecha de notificación'], ['definicion', 'Definición'],
    ['servicio', 'Servicio'], ['ubicacion', 'Ubicación'],
    ['diagnostico', 'Diagnóstico IAAS'], ['origen', 'Origen'],
    ['condicion', 'Condición'], ['vigepes', 'VIGEPES-08'],
    ['sexo', 'Sexo'], ['edad', 'Edad'],
    ['microorganismo', 'Microorganismos'], ['dispositivo', 'Dispositivos'],
    ['causa', 'Causa raíz'], ['deteccion', 'Días ingreso-notificación'],
    ['a_investigacion', 'Días notificación-investigación'],
    ['a_vigepes', 'Días notificación-VIGEPES']
  ];

  /** Botón que baja como CSV exactamente lo que los filtros dejan a la vista.
   *
   * El informe mensual se escribe fuera del dashboard; sin esto, las cifras se
   * copian a mano de la pantalla, que es donde se cuelan los errores.
   */
  function botonCsv(filas) {
    const boton = document.createElement('button');
    boton.className = 'chip';
    boton.type = 'button';
    boton.style.marginBottom = '16px';
    boton.textContent = 'Descargar CSV (' + charts.num(filas.length) + ' casos)';
    boton.addEventListener('click', () => {
      const r = DATA.vigilancia.rows;
      const dims = DATA.vigilancia.dims;
      const MS = 86400000;
      const escapar = valor => {
        const texto = valor === null || valor === undefined ? '' : String(valor);
        return /[",\n;]/.test(texto) ? '"' + texto.replace(/"/g, '""') + '"'
                                     : texto;
      };
      const lineas = [COLUMNAS_CSV.map(c => escapar(c[1])).join(',')];
      for (const i of filas) {
        const celdas = COLUMNAS_CSV.map(([clave]) => {
          if (clave === 'fecha') {
            return r.dia[i] === null ? ''
              : new Date(r.dia[i] * MS).toISOString().slice(0, 10);
          }
          if (Array.isArray(r[clave][0])) {
            // Dimensión matriz: se juntan las etiquetas marcadas del caso.
            return dims[clave].filter((_, k) => r[clave][k][i] === 1).join(' | ');
          }
          const valor = r[clave][i];
          return dims[clave] ? dims[clave][valor] : valor;
        });
        lineas.push(celdas.map(escapar).join(','));
      }
      // BOM: sin él Excel abre los acentos rotos, que es como se abre siempre.
      const blob = new Blob(['\ufeff' + lineas.join('\r\n')],
                            {type: 'text/csv;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const enlace = document.createElement('a');
      enlace.href = url;
      enlace.download = 'vigilancia-iaas.csv';
      enlace.click();
      // Revocar en el mismo turno corta la descarga a medias en algunos
      // navegadores: se libera cuando el clic ya se ha procesado.
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    return boton;
  }

  /** Detalle de un conglomerado: resumen, cronología y qué falta por hacer. */
  function tarjetaDetalle(grupo) {
    const d = vigilancia.detalleConglomerado(grupo);
    const caja = document.createElement('div');

    const tarjeta = card(
      'Conglomerado: ' + grupo.microorganismo + ' en ' + grupo.servicio,
      grupo.casos + ' casos confirmados entre el ' + grupo.desde + ' y el ' +
      grupo.hasta + ', en ' + grupo.dias + ' días.');

    const cerrar = document.createElement('button');
    cerrar.className = 'chip';
    cerrar.type = 'button';
    cerrar.textContent = 'Cerrar detalle ✕';
    cerrar.addEventListener('click', () => {
      estado.conglomerado = null;
      render();
    });
    tarjeta.appendChild(cerrar);

    const r = d.resumen;
    const zona = zonaDe(tarjeta);
    charts.tabla(zona,
      [{titulo: 'Dato'}, {titulo: 'Valor', num: true}],
      [['Casos en la ventana', charts.num(r.casos)],
       ['Ubicaciones distintas', charts.num(r.ubicaciones)],
       ['Días entre notificaciones (mediana)', dias(r.intervalo)],
       ['Días de ingreso a notificación (mediana)', dias(r.estancia)],
       ['De origen extrahospitalario', charts.num(r.importados)],
       ['Fallecidos', charts.num(r.fallecidos)],
       ['VIGEPES-08 pendientes', charts.num(r.pendientes)],
       ['Investigaciones abiertas', charts.num(r.abiertas)],
       ['Casos sin investigación registrada', charts.num(r.sinInv)]]);

    caja.appendChild(tarjeta);

    const cronologia = tarjetaTabla(
      'Cronología del conglomerado',
      'Una fila por caso, por fecha de notificación. La fecha de notificación ' +
      'no es la de inicio de síntomas: varios casos notificados el mismo día ' +
      'suelen ser una búsqueda activa, no contagios simultáneos. Sin edad, ' +
      'sexo ni desenlace por fila — van contados en el resumen.',
      [{titulo: 'Notificado'}, {titulo: 'Ubicación'}, {titulo: 'Origen'},
       {titulo: 'Días desde el ingreso', num: true, formato: dias},
       {titulo: 'Días hasta investigar', num: true, formato: dias},
       {titulo: 'Investigación'}],
