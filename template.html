      d.cronologia.map(c => [c.fecha, c.ubicacion, c.origen, c.estancia,
                             c.aInvestigacion, c.investigacion]));
    caja.appendChild(cronologia);
    return caja;
  }

  function renderVigilancia() {
    if (!DATA.vigilancia.ok) {
      // La pestaña sigue existiendo y dice por qué no hay datos: si
      // desapareciera, un fallo de la fuente pasaría por "aquí nunca hubo nada".
      contenedor.appendChild(vacio(
        'Datos de vigilancia no disponibles: ' + DATA.vigilancia.error +
        (DATA.vigilancia.fecha ? ' (último intento: ' + DATA.vigilancia.fecha + ')' : '')));
      return;
    }
    const meta = DATA.vigilancia.meta;
    const filas = vigilancia.filasActivas(storeVig.filters);
    if (!filas.length) {
      contenedor.appendChild(vacio('Sin casos para estos filtros.'));
      return;
    }
    const conf = vigilancia.confirmados(filas);
    const k = vigilancia.kpis(filas);

    const cabecera = document.createElement('div');
    cabecera.className = 'kpis';
    cabecera.style.marginBottom = '16px';
    // La variación del último mes: un recuento suelto no dice si sube o baja.
    const v = vigilancia.variacion(filas, 'mes');
    const textoVariacion = v && v.media > 0
      ? v.etiqueta + ': ' + charts.num(v.valor) + ' frente a ' +
        v.media.toFixed(1) + ' de media previa' +
        (v.enCurso ? ' · mes en curso' : '')
      : null;
    cabecera.appendChild(kpi('Casos notificados', charts.num(k.casos)));
    cabecera.appendChild(kpi('IAAS confirmadas', charts.num(k.confirmados),
                             charts.pct(k.confirmacion) + ' de lo notificado'));
    if (textoVariacion) {
      cabecera.appendChild(kpi('Último mes', charts.num(v.valor), textoVariacion));
    }
    cabecera.appendChild(kpi('Letalidad', charts.pct(k.letalidad),
                             charts.num(k.fallecidos) + ' fallecidos'));
    cabecera.appendChild(kpi('VIGEPES-08 pendiente', charts.num(k.pendientes)));
    cabecera.appendChild(kpi('Con investigación', charts.num(k.investigados),
                             charts.num(k.cerrados) + ' cerradas'));
    contenedor.appendChild(cabecera);

    // Los pacientes distintos no son filtrables: contarlos por filtro exigiría
    // publicar un identificador por caso, y fecha + servicio + edad basta para
    // reidentificar a alguien. Solo el total del periodo completo.
    const nota = document.createElement('div');
    nota.className = 'sub';
    nota.style.marginBottom = '16px';
    nota.textContent = 'Sobre el periodo completo: ' +
      charts.num(meta.pacientes) + ' pacientes distintos en ' +
      charts.num(meta.casos) + ' casos. La letalidad y el VIGEPES-08 se ' +
      'calculan solo sobre los casos confirmados.';
    contenedor.appendChild(nota);

    // Los casos sin fecha desaparecen al filtrar por fechas. Callarlo haría
    // pasar por "hubo menos casos" lo que en realidad es un hueco del registro.
    const fuera = vigilancia.excluidosPorFecha(storeVig.filters);
    if (fuera) {
      const aviso = document.createElement('div');
      aviso.className = 'sub';
      aviso.style.marginBottom = '16px';
      aviso.textContent = fuera === 1
        ? '1 caso cumple el resto de filtros pero no tiene fecha de ' +
          'notificación, así que el rango de fechas lo deja fuera.'
        : charts.num(fuera) + ' casos cumplen el resto de filtros pero no ' +
          'tienen fecha de notificación, así que el rango de fechas los deja ' +
          'fuera.';
      contenedor.appendChild(aviso);
    }

    contenedor.appendChild(botonCsv(filas));

    // --- Señales que hay que mirar antes que nada -------------------------
    const grupos = vigilancia.conglomerados(filas, VENTANA_CONGLOMERADO,
                                            MINIMO_CONGLOMERADO);
    if (grupos.length) {
      contenedor.appendChild(tarjetaTabla(
        'Posibles conglomerados',
        MINIMO_CONGLOMERADO + ' o más casos confirmados del mismo ' +
        'microorganismo, en el mismo servicio, dentro de ' +
        VENTANA_CONGLOMERADO + ' días. No prueba un brote: es lo que hay que ' +
        'mirar de cerca antes de que lo sea. Pincha una fila para ver el ' +
        'detalle.',
        [{titulo: 'Servicio'}, {titulo: 'Microorganismo'},
         {titulo: 'Casos', num: true, formato: charts.num},
         {titulo: 'Días', num: true, formato: charts.num},
         {titulo: 'Desde'}, {titulo: 'Hasta'}],
        // La clave viaja como séptima celda: `columnas` decide qué se pinta,
        // así que no se ve, y onFila la recibe entera.
        grupos.map(g => [g.servicio, g.microorganismo, g.casos, g.dias,
                         g.desde, g.hasta, g.clave]),
        null,
        fila => { estado.conglomerado = fila[6]; render(); }));

      // El detalle se pinta debajo de la tabla, no en lugar de ella: quien
      // compara dos conglomerados no quiere perder la lista al abrir uno.
      const abierto = grupos.find(g => g.clave === estado.conglomerado);
      if (abierto) contenedor.appendChild(tarjetaDetalle(abierto));
    }

    // --- Proceso de vigilancia -------------------------------------------
    const emb = vigilancia.embudo(filas);
    contenedor.appendChild(tarjetaRanking(
      'Embudo de vigilancia',
      'De la notificación al cierre de la investigación. Las categorías no ' +
      'suman: un caso está en varias.',
      emb, 'Etapa'));

    const tEvo = card('Evolución',
                      'Casos confirmados frente al resto de notificaciones.');
    let periodo = 'mes';
    const conmutador = document.createElement('div');
    conmutador.style.margin = '8px 0';
    // Antes de crear la zona: conTabla la añade al final de la tarjeta y el
    // conmutador tiene que quedar por encima del gráfico.
    tEvo.appendChild(conmutador);
    const serieEvo = () => vigilancia.serie(filas, periodo);
    const repintarEvo = conTabla(tEvo,
      () => [{titulo: periodo === 'mes' ? 'Mes' : 'Semana'},
             {titulo: 'Confirmados', num: true, formato: charts.num},
             {titulo: 'Otros', num: true, formato: charts.num}],
      () => {
        const s = serieEvo();
        return s.labels.map((l, i) => [l, s.confirmados[i], s.otros[i]]);
      },
      zona => {
        const s = serieEvo();
        charts.line(plot(zona, 'v-evo'), {
          labels: s.labels,
          formato: charts.num,
          series: [
            {label: 'Confirmados', data: s.confirmados,
             color: charts.token('series-1')},
            {label: 'Sospechosos y descartados', data: s.otros,
             color: charts.token('series-2')}
          ]
        });
      });
    [['mes', 'Por mes'], ['semana', 'Por semana']].forEach(([valor, texto]) => {
      const b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.textContent = texto;
      b.addEventListener('click', () => { periodo = valor; repintarEvo(); });
      conmutador.appendChild(b);
    });
    contenedor.appendChild(tEvo);

    // Curva epidémica: la pregunta no es cuántos casos hay, sino si esta
    // semana se sale de lo que venían siendo las anteriores.
    const semanas = vigilancia.curva(filas, VENTANA_UMBRAL).semanas;
    const conUmbral = semanas.filter(s => s.umbral !== null);
    if (conUmbral.length >= 2) {
      const alertas = semanas.filter(s => s.alerta).length;
      const tCurva = card(
        'Curva epidémica semanal',
        'Casos confirmados por semana y umbral de aviso: media de las ' +
        VENTANA_UMBRAL + ' semanas previas más dos desviaciones típicas. Con ' +
        'recuentos tan pequeños el umbral es orientativo — señala variación ' +
        'inusual, no brote. Las primeras semanas no tienen historia detrás y ' +
        'salen sin umbral.' +
        (alertas ? ' Semanas por encima del umbral: ' + alertas + '.' : ''));
      conTabla(tCurva,
        [{titulo: 'Semana (lunes)'},
         {titulo: 'Casos', num: true, formato: charts.num},
         {titulo: 'Media previa', num: true, formato: decimales},
         {titulo: 'Umbral', num: true, formato: decimales},
         {titulo: 'Aviso'}],
        semanas.map(s => [s.label, s.casos, s.media, s.umbral,
                          s.alerta ? '▲' : '']),
        zona => charts.line(plot(zona, 'v-curva'), {
          labels: semanas.map(s => s.label),
          formato: charts.num,
          series: [
            {label: 'Casos', data: semanas.map(s => s.casos),
             color: charts.token('series-1')},
            {label: 'Umbral', data: semanas.map(s => s.umbral),
             color: charts.token('series-3')}
          ]
        }));
      contenedor.appendChild(tCurva);
    }

    const oportunidad = [
      ['Ingreso → notificación', vigilancia.intervalo(filas, 'deteccion')],
      ['Notificación → investigación', vigilancia.intervalo(filas, 'a_investigacion')],
      ['Notificación → VIGEPES-08', vigilancia.intervalo(filas, 'a_vigepes')]
    ];
    contenedor.appendChild(tarjetaTabla(
      'Oportunidad del proceso',
      'Días entre hitos. Mediana y no media: la cola es larga y una sola ' +
      'demora movería el promedio. «Casos» son aquellos con las dos fechas.',
      [{titulo: 'Intervalo'},
       {titulo: 'Casos', num: true, formato: charts.num},
       {titulo: 'Mediana', num: true, formato: dias},
       {titulo: 'P90', num: true, formato: dias},
       {titulo: 'Máximo', num: true, formato: dias}],
      oportunidad.map(([label, v]) => [label, v.n, v.mediana, v.p90, v.max])));

    // --- Dónde y qué ------------------------------------------------------
    contenedor.appendChild(tarjetaRanking(
      'IAAS confirmadas por servicio', 'Servicio donde está el paciente.',
      vigilancia.porDim(conf, 'servicio'), 'Servicio'));
    contenedor.appendChild(tarjetaRanking(
      'IAAS confirmadas por ubicación', 'El segundo nivel del área.',
      vigilancia.porDim(conf, 'ubicacion'), 'Ubicación'));
    contenedor.appendChild(tarjetaRanking(
      'Diagnóstico de IAAS', 'Solo casos confirmados.',
      vigilancia.porDim(conf, 'diagnostico'), 'Diagnóstico'));

    const origen = vigilancia.porDim(conf, 'origen');
    contenedor.appendChild(tarjetaRanking(
      'Origen de la infección',
      'Extrahospitalario es infección importada: cuenta para la carga ' +
      'asistencial, no para la tasa del hospital.',
      origen, 'Origen'));

    // --- Microbiología ----------------------------------------------------
    const micro = vigilancia.porMulti(conf, 'microorganismo');
    contenedor.appendChild(tarjetaRanking(
      'Microorganismos aislados',
      'Un caso puede aportar más de uno, así que la suma pasa del total.',
      micro, 'Microorganismo'));

    const cruceMicro = vigilancia.cruce(conf, 'microorganismo', 'servicio', true);
    if (cruceMicro.filas.length) {
      contenedor.appendChild(tarjetaTabla(
        'Microorganismo por servicio',
        'Dónde aparece cada uno. Un mismo microorganismo repitiéndose en un ' +
        'servicio en pocos días es la señal que hay que mirar de cerca.',
        [{titulo: 'Microorganismo'},
         ...cruceMicro.columnas.map(c => ({titulo: c, num: true,
                                           formato: charts.num})),
         {titulo: 'Total', num: true, formato: charts.num}],
        cruceMicro.filas.map(f => [f.label, ...f.valores, f.total])));
    }

    // --- Dispositivos -----------------------------------------------------
    const disp = vigilancia.dispositivos(conf);
    if (disp.length) {
      const tDisp = card(
        'Dispositivos invasivos',
        'Densidad de incidencia sobre los días de exposición registrados en ' +
        'las investigaciones, no sobre el censo de días-dispositivo del ' +
        'hospital: sirve para comparar dispositivos entre sí y en el tiempo, ' +
        'no como tasa oficial.');
      conTabla(tDisp,
        [{titulo: 'Dispositivo'},
         {titulo: 'Casos', num: true, formato: charts.num},
         {titulo: 'Días registrados', num: true, formato: charts.num},
         {titulo: 'Casos / 1.000 días', num: true, formato: decimales},
         {titulo: 'Bundle cumple', num: true, formato: charts.pct},
         {titulo: 'Evaluados', num: true, formato: charts.num}],
        disp.map(e => [e.label, e.casos, e.dias, e.densidad, e.bundle,
                       e.evaluados]),
        zona => barrasEn(zona, disp, disp.map(e => e.densidad), decimales));
      contenedor.appendChild(tDisp);
    }

    // --- Infección del sitio quirúrgico -----------------------------------
    const sinDato = DATA.vigilancia.etiquetas.sin_dato;
    const herida = vigilancia.porDim(conf, 'herida').filter(e => e.label !== sinDato);
    if (herida.length) {
      contenedor.appendChild(tarjetaRanking(
        'ISQ por clasificación de herida',
        'Limpia, limpia-contaminada, contaminada y sucia tienen riesgo basal ' +
        'distinto: comparar sin separarlas mezcla cosas que no se comparan.',
        herida, 'Clasificación'));
      const intervencion = vigilancia.porDim(conf, 'intervencion')
        .filter(e => e.label !== sinDato);
      const procedimiento = vigilancia.porDim(conf, 'procedimiento')
        .filter(e => e.label !== sinDato);
      contenedor.appendChild(tarjetaTabla(
        'ISQ por tipo de intervención', null,
        [{titulo: 'Tipo'}, {titulo: 'Casos', num: true, formato: charts.num}],
        intervencion.map(e => [e.label, e.casos])));
      contenedor.appendChild(tarjetaRanking(
        'ISQ por procedimiento', 'Procedimiento quirúrgico asociado.',
        procedimiento, 'Procedimiento'));
    }

    // --- Desenlace y causas -----------------------------------------------
    const letalidad = vigilancia.porDimCon(conf, 'diagnostico', 'condicion', 'Fallecido')
      .filter(e => e.casos > 0);
    contenedor.appendChild(tarjetaTabla(
      'Letalidad por diagnóstico',
      'Fallecidos entre los casos confirmados. Es letalidad cruda: no ' +
      'distingue si la IAAS causó la muerte o acompañó a otra cosa.',
      [{titulo: 'Diagnóstico'},
       {titulo: 'Casos', num: true, formato: charts.num},
       {titulo: 'Fallecidos', num: true, formato: charts.num},
       {titulo: 'Letalidad', num: true, formato: charts.pct}],
      letalidad.map(e => [e.label, e.casos, e.marcados,
                          e.casos ? e.marcados / e.casos : null]),
      ['Total (' + letalidad.length + ')',
       letalidad.reduce((x, e) => x + e.casos, 0),
       letalidad.reduce((x, e) => x + e.marcados, 0),
       k.letalidad]));

    const causas = vigilancia.porMulti(conf, 'causa');
    if (causas.length) {
      const totalCausas = causas.reduce((x, e) => x + e.casos, 0);
      let acumulado = 0;
      const pareto = causas.map(e => {
        acumulado += e.casos;
        return [e.label, e.casos, acumulado / totalCausas];
      });
      const tCausas = card(
        'Causa raíz identificada',
        'Ordenado por frecuencia, con el acumulado: las primeras filas son ' +
        'donde una intervención rinde más. Un caso puede tener varias causas.');
      conTabla(tCausas,
        [{titulo: 'Causa'},
         {titulo: 'Casos', num: true, formato: charts.num},
         {titulo: 'Acumulado', num: true, formato: charts.pct}],
        pareto, zona => barrasEn(zona, causas));
      contenedor.appendChild(tCausas);
    }

    const cronicas = vigilancia.porMulti(conf, 'cronica');
    if (cronicas.length) {
      contenedor.appendChild(tarjetaRanking(
        'Enfermedades crónicas de base',
        'De la investigación del caso. Un paciente puede tener varias.',
        cronicas, 'Enfermedad'));
    }

    // --- Demografía -------------------------------------------------------
    const demografia = vigilancia.cruce(conf, 'edad', 'sexo', false);
    if (demografia.filas.length) {
      contenedor.appendChild(tarjetaTabla(
        'Edad y sexo',
        'Tramos fijos del informe epidemiológico, para poder comparar entre ' +
        'periodos. La fecha de nacimiento no se publica, solo el tramo.',
        [{titulo: 'Edad'},
         ...demografia.columnas.map(c => ({titulo: c, num: true,
                                           formato: charts.num})),
         {titulo: 'Total', num: true, formato: charts.num}],
        demografia.filas.map(f => [f.label, ...f.valores, f.total])));
    }

    // --- Calidad del dato -------------------------------------------------
    const cuentaSin = clave => vigilancia.porDim(filas, clave)
      .filter(e => e.label === sinDato)
      .reduce((x, e) => x + e.casos, 0);
    contenedor.appendChild(tarjetaTabla(
      'Calidad del registro',
      'Lo que falta en el sistema. Cada hueco es un caso que no entra en ' +
      'alguna de las tarjetas de arriba.',
      [{titulo: 'Hueco'}, {titulo: 'Casos', num: true, formato: charts.num}],
      [['Sin fecha de notificación (periodo completo)', meta.sin_fecha],
       ['Fechas rescatadas del export de Kobo', meta.fechas_rescatadas],
       ['Sin servicio', cuentaSin('servicio')],
       ['Sin ubicación', cuentaSin('ubicacion')],
       ['Sin diagnóstico de IAAS', cuentaSin('diagnostico')],
       ['Sin investigación registrada', k.casos - k.investigados],
       ['Investigación abierta', k.investigados - k.cerrados],
       ['VIGEPES-08 pendiente (confirmados)', k.pendientes]]));
  }

  function irA(vista, clave) {
    estado.vista = vista;
    if (vista === 'responsable') estado.responsable = clave;
    if (vista === 'formulario') estado.formulario = clave;
    document.querySelectorAll('.tabs button').forEach(b =>
      b.setAttribute('aria-selected', String(b.dataset.view === vista)));
    render();
  }

  const TOPE_MOTIVOS = 10;
  const SIN_RIESGO = '(Sin nivel de riesgo)';

  function selectorFormulario(disponibles) {
    const label = document.createElement('label');
    label.style.cssText = 'display:flex;flex-direction:column;font-size:12px;gap:3px';
    label.textContent = 'Formulario';
    const sel = document.createElement('select');
    sel.style.cssText = 'font:inherit;font-size:14px;padding:6px 9px;border-radius:7px;' +
      'border:1px solid var(--border);background:var(--surface);color:var(--text-primary)';
    disponibles.forEach(idx => {
      const id = DATA.dims.formulario[idx];
      const op = document.createElement('option');
      op.value = String(idx);
      op.textContent = DATA.forms[id].nombre;
      if (idx === estado.formulario) op.selected = true;
      sel.appendChild(op);
    });
    sel.addEventListener('change', () => {
      estado.formulario = Number(sel.value);
      render();
    });
    label.appendChild(sel);
    return label;
  }

  function renderFormulario(filas) {
    const disponibles = [...new Set(filas.map(i => DATA.rows.formulario[i]))]
      .sort((a, b) => DATA.forms[DATA.dims.formulario[a]].nombre
        .localeCompare(DATA.forms[DATA.dims.formulario[b]].nombre, 'es'));
    if (estado.formulario === null || !disponibles.includes(estado.formulario)) {
      estado.formulario = disponibles[0];
    }

    const id = DATA.dims.formulario[estado.formulario];
    const meta = DATA.forms[id];
    const suyas = filas.filter(i => DATA.rows.formulario[i] === estado.formulario);

    const cabecera = document.createElement('div');
    cabecera.style.cssText = 'display:flex;gap:16px;align-items:flex-end;margin-bottom:8px';
    cabecera.appendChild(selectorFormulario(disponibles));
    contenedor.appendChild(cabecera);

    const ficha = document.createElement('div');
    ficha.className = 'sub';
    ficha.style.marginBottom = '16px';
    ficha.textContent =
      `${meta.medida} · ${meta.submedida} · versión ${meta.version} · ${id}`;
    contenedor.appendChild(ficha);

    if (!suyas.length) {
      contenedor.appendChild(vacio('Sin registros de este formulario para estos filtros.'));
      return;
    }

    const k = agg.kpis(suyas);
    const fila = document.createElement('div');
    fila.className = 'kpis';
    fila.style.marginBottom = '16px';
    fila.append(
      kpi('Supervisiones', charts.num(k.total)),
      kpi('Tasa de cumplimiento', charts.pct(k.tasa),
          charts.num(k.sinDictamen) + ' sin dictamen'),
      kpi('Responsables', charts.num(k.responsables)),
      kpi('Aprobados', charts.pct(k.tasaAprobado))
    );
    contenedor.appendChild(fila);

    // Evolución y volumen: de nuevo dos plots apilados, nunca doble eje.
    const s = agg.series(suyas, 'mes');
    const rejillaTiempo = document.createElement('div');
    rejillaTiempo.className = 'grid-2';
    const tTasa = card('Tasa de cumplimiento por mes', null);
    conTabla(tTasa,
      [{titulo: 'Mes'}, {titulo: 'Tasa', num: true, formato: charts.pct}],
      s.labels.map((l, i) => [l, s.tasa[i]]),
      zona => charts.line(plot(zona, 'f-tasa'), {
        labels: s.labels,
        series: [{label: 'Tasa de cumplimiento', data: s.tasa,
                  color: charts.token('series-1')}]
      }));
    const tVol = card('Supervisiones por mes', null);
    conTabla(tVol,
      [{titulo: 'Mes'}, {titulo: 'Supervisiones', num: true}],
      s.labels.map((l, i) => [l, s.volumen[i]]),
      zona => charts.columns(plot(zona, 'f-vol'), {
        labels: s.labels, values: s.volumen, formato: charts.num
      }));
    rejillaTiempo.append(tTasa, tVol);
    contenedor.appendChild(rejillaTiempo);

    // Desglose por unidad, área, grupo y responsable.
    const rejilla = document.createElement('div');
    rejilla.className = 'grid-2';
    for (const [clave, titulo] of [
      ['unidad', 'Unidad / servicio'], ['area', 'Área específica'],
      ['grupo', 'Grupo ocupacional'], ['responsable', 'Responsable']
    ]) {
      const datos = agg.rateBy(suyas, clave).slice(0, TOPE_BARRAS);
      const tarjeta = card(titulo, null);
      conTabla(tarjeta,
        [{titulo}, {titulo: 'Supervisiones', num: true},
         {titulo: 'Tasa', num: true, formato: charts.pct}],
        datos.map(e => [e.label, e.total, e.tasa]),
        zona => {
          const caja = document.createElement('div');
          caja.className = 'plot';
          caja.style.height = Math.max(140, datos.length * 24 + 40) + 'px';
          const lienzo = document.createElement('canvas');
          caja.appendChild(lienzo);
          zona.appendChild(caja);
          charts.bars(lienzo, {
            labels: datos.map(e => `${e.label} (${e.total})`),
            values: datos.map(e => e.tasa),
            formato: charts.pct
          });
        });
      rejilla.appendChild(tarjeta);
    }
    contenedor.appendChild(rejilla);

    // Estado de validación: dos clases, tabla directa. Un gráfico de dos
    // barras no añadiría nada a dos números.
    const porEstado = agg.rateBy(suyas, 'estado');
    const tEstado = card('Estado de validación', null);
    charts.tabla(zonaDe(tEstado),
      [{titulo: 'Estado'}, {titulo: 'Supervisiones', num: true},
       {titulo: 'Tasa', num: true, formato: charts.pct}],
      porEstado.map(e => [e.label, e.total, e.tasa]));
    contenedor.appendChild(tEstado);

    // Nivel de riesgo: solo si hay algo más que "(Sin nivel de riesgo)".
    const porRiesgo = agg.rateBy(suyas, 'riesgo')
      .filter(e => e.label !== SIN_RIESGO);
    const tRiesgo = card('Nivel de riesgo', null);
    if (porRiesgo.length) {
      charts.tabla(zonaDe(tRiesgo),
        [{titulo: 'Nivel'}, {titulo: 'Supervisiones', num: true}],
        porRiesgo.map(e => [e.label, e.total]));
    } else {
      tRiesgo.appendChild(vacio('Sin datos de riesgo para este formulario.'));
    }
    contenedor.appendChild(tRiesgo);

    // Motivos de no cumplimiento. Texto libre, 366 valores distintos en el
    // conjunto completo: cola larga. Top 10 y el resto agrupado.
    const fallidas = suyas.filter(i => DATA.rows.cumple[i] === 0);
    const tMotivos = card('Motivos de no cumplimiento',
                          `${fallidas.length} supervisiones no cumplieron.`);
    if (fallidas.length) {
      const cuenta = new Map();
      for (const i of fallidas) {
        const m = DATA.dims.motivo[DATA.rows.motivo[i]] || '(Sin motivo indicado)';
        cuenta.set(m, (cuenta.get(m) || 0) + 1);
      }
      const orden = [...cuenta.entries()].sort((a, b) => b[1] - a[1]);
      const top = orden.slice(0, TOPE_MOTIVOS);
      const resto = orden.slice(TOPE_MOTIVOS).reduce((n, e) => n + e[1], 0);
      if (resto) top.push(['Otros motivos', resto]);
      charts.tabla(zonaDe(tMotivos),
        [{titulo: 'Motivo'}, {titulo: 'Supervisiones', num: true}], top);

      const detalles = document.createElement('details');
      detalles.style.marginTop = '10px';
      const resumenEl = document.createElement('summary');
      resumenEl.textContent = 'Ver conclusiones y recomendaciones';
      resumenEl.style.cursor = 'pointer';
      detalles.appendChild(resumenEl);
      for (const i of fallidas) {
        const texto = DATA.texts.conclusiones[String(i)];
        if (!texto) continue;
        const p = document.createElement('p');
        p.style.cssText = 'margin:8px 0;padding-left:10px;border-left:2px solid var(--grid)';
        const quien = document.createElement('strong');
        quien.textContent = DATA.dims.responsable[DATA.rows.responsable[i]] + ': ';
        p.appendChild(quien);
        p.appendChild(document.createTextNode(texto));
        detalles.appendChild(p);
      }
      tMotivos.appendChild(detalles);
    } else {
      tMotivos.appendChild(vacio('Todas las supervisiones de este formulario cumplieron.'));
    }
    contenedor.appendChild(tMotivos);

    // Registros individuales.
    const DIA_MS = 86400000;
    const tRegistros = card('Registros', null);
    charts.tabla(zonaDe(tRegistros),
      [{titulo: 'Fecha'}, {titulo: 'Responsable'}, {titulo: 'Evaluado'},
       {titulo: 'Unidad'}, {titulo: '%', num: true}, {titulo: 'Sí', num: true},
       {titulo: 'No', num: true}, {titulo: 'N/A', num: true},
       {titulo: 'Cumple'}, {titulo: 'Estado'}],
      suyas.map(i => [
        new Date(DATA.rows.dia[i] * DIA_MS).toISOString().slice(0, 10),
        DATA.dims.responsable[DATA.rows.responsable[i]],
        DATA.texts.evaluado[i],
        DATA.dims.unidad[DATA.rows.unidad[i]],
        DATA.rows.pct[i], DATA.rows.si[i], DATA.rows.no[i], DATA.rows.na[i],
        DATA.rows.cumple[i] === 1 ? 'Sí' : DATA.rows.cumple[i] === 0 ? 'No' : '—',
        DATA.dims.estado[DATA.rows.estado[i]]
      ]));
    contenedor.appendChild(tRegistros);
  }

  return {estado, render, card, conTabla, zonaDe, plot, vacio, kpi, irA};
})();
</script>
<script id="mod-app">
document.getElementById('meta').textContent =
  DATA.meta.filas + ' supervisiones · generado ' + DATA.meta.generado;

const app = (() => {
  const barra = document.getElementById('filters');
  const zonaChips = document.getElementById('chips');

  const ETIQUETAS = {
    medida: 'Medida', submedida: 'Submedida', unidad: 'Unidad / servicio',
    grupo: 'Grupo ocupacional', cargo: 'Cargo', estado: 'Estado de validación'
  };
  const DIA_MS = 86400000;
  const aISO = dia => new Date(dia * DIA_MS).toISOString().slice(0, 10);
  const aDia = iso => Math.floor(Date.parse(iso) / DIA_MS);

  function selector(clave) {
    const label = document.createElement('label');
    label.textContent = ETIQUETAS[clave];
    const sel = document.createElement('select');
    const todos = document.createElement('option');
    todos.value = '';
    todos.textContent = 'Todos';
    sel.appendChild(todos);
    DATA.dims[clave].forEach((valor, i) => {
      const op = document.createElement('option');
      op.value = String(i);
      op.textContent = valor;   // valor del Excel: textContent, no innerHTML
      sel.appendChild(op);
    });
    sel.addEventListener('change', () => {
      store.set(clave, sel.value === '' ? null : Number(sel.value));
    });
    sel.dataset.clave = clave;
    label.appendChild(sel);
    return label;
  }

  function fecha(clave, texto) {
    const label = document.createElement('label');
    label.textContent = texto;
    const input = document.createElement('input');
    input.type = 'date';
    input.min = aISO(DATA.meta.dia_min);
    input.max = aISO(DATA.meta.dia_max);
    input.addEventListener('change', () => {
      store.set(clave, input.value ? aDia(input.value) : null);
    });
    input.dataset.clave = clave;
    label.appendChild(input);
    return label;
  }

  /** Las pestañas con fuente propia: store, datos y dimensiones filtrables.
   *
   * Los selectores, el rango de fechas y los chips son idénticos para las dos
   * —solo cambia de dónde salen las opciones y a qué store escriben—, así que
   * se parametrizan en vez de duplicarse: dos copias acabarían divergiendo.
   */
  const FUENTES = {
    iaas: {
      store: () => storeIaas,
      datos: () => DATA.iaas,
      filtros: ['responsable', 'servicio', 'actividad'],
      etiquetas: {responsable: 'Responsable', servicio: 'Servicio',
                  actividad: 'Actividad'},
      // La actividad no es una dimensión codificada: es la lista de columnas.
      opciones: clave => clave === 'actividad'
        ? DATA.iaas.actividades : DATA.iaas.dims[clave]
    },
    vigilancia: {
      store: () => storeVig,
      datos: () => DATA.vigilancia,
      filtros: ['definicion', 'servicio', 'ubicacion', 'diagnostico', 'origen',
                'microorganismo', 'dispositivo'],
      etiquetas: {definicion: 'Definición', servicio: 'Servicio',
                  ubicacion: 'Ubicación', diagnostico: 'Diagnóstico',
                  origen: 'Origen', microorganismo: 'Microorganismo',
                  dispositivo: 'Dispositivo'},
      opciones: clave => DATA.vigilancia.dims[clave]
    }
  };

  function selectorFuente(fuente, clave) {
    const label = document.createElement('label');
    label.textContent = fuente.etiquetas[clave];
    const sel = document.createElement('select');
    const todos = document.createElement('option');
    todos.value = '';
    todos.textContent = 'Todos';
    sel.appendChild(todos);
    fuente.opciones(clave).forEach((valor, i) => {
      const op = document.createElement('option');
      op.value = String(i);
      op.textContent = valor;   // valor de la fuente: textContent, no innerHTML
      sel.appendChild(op);
    });
    sel.addEventListener('change', () => {
      fuente.store().set(clave, sel.value === '' ? null : Number(sel.value));
    });
    sel.dataset.clave = clave;
    label.appendChild(sel);
    return label;
  }

  function fechaFuente(fuente, clave, texto) {
    const label = document.createElement('label');
    label.textContent = texto;
    const input = document.createElement('input');
    input.type = 'date';
    input.min = aISO(fuente.datos().meta.dia_min);
    input.max = aISO(fuente.datos().meta.dia_max);
    input.addEventListener('change', () => {
      fuente.store().set(clave, input.value ? aDia(input.value) : null);
    });
    input.dataset.clave = clave;
    label.appendChild(input);
    return label;
  }

  function botonLimpiar(alLimpiar) {
    const limpiar = document.createElement('button');
    limpiar.className = 'chip';
    limpiar.type = 'button';
    limpiar.textContent = 'Limpiar filtros';
    limpiar.addEventListener('click', () => {
      barra.querySelectorAll('select, input').forEach(c => { c.value = ''; });
      alLimpiar();
    });
    return limpiar;
  }

  function construirBarra() {
    // La barra se reconstruye al cambiar de pestaña: las dimensiones de una
    // fuente no existen en las otras y saldrían como selectores muertos.
    barra.replaceChildren();
    const fuente = FUENTES[views.estado.vista];
    if (fuente) {
      // Sin datos no hay qué filtrar; el aviso lo pinta la vista.
      if (!fuente.datos().ok) return;
      barra.append(fechaFuente(fuente, 'desde', 'Desde'),
                   fechaFuente(fuente, 'hasta', 'Hasta'));
      fuente.filtros.forEach(k => barra.appendChild(selectorFuente(fuente, k)));
      barra.appendChild(botonLimpiar(() => fuente.store().clearAll()));
      return;
    }
    // El rango de fechas va primero: es el filtro al que todos van.
    barra.append(fecha('desde', 'Desde'), fecha('hasta', 'Hasta'));
    store.dimsFiltrables.forEach(k => barra.appendChild(selector(k)));
    barra.appendChild(botonLimpiar(() => store.clearAll()));
  }

  function pintarChipsFuente(fuente) {
    zonaChips.replaceChildren();
    for (const [clave, valor] of Object.entries(fuente.store().filters)) {
      if (valor === null) continue;
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.type = 'button';
      const texto = clave === 'desde' ? 'Desde ' + aISO(valor)
        : clave === 'hasta' ? 'Hasta ' + aISO(valor)
        : fuente.etiquetas[clave] + ': ' + fuente.opciones(clave)[valor];
      chip.textContent = texto + ' ✕';
      chip.addEventListener('click', () => {
        const control = barra.querySelector('[data-clave="' + clave + '"]');
        if (control) control.value = '';
        fuente.store().clear(clave);
      });
      zonaChips.appendChild(chip);
    }
  }

  function pintarChips() {
    zonaChips.replaceChildren();
    for (const [clave, valor] of Object.entries(store.filters)) {
      if (valor === null) continue;
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.type = 'button';
      const texto = clave === 'desde' ? 'Desde ' + aISO(valor)
        : clave === 'hasta' ? 'Hasta ' + aISO(valor)
        : ETIQUETAS[clave] + ': ' + DATA.dims[clave][valor];
      chip.textContent = texto + ' ✕';
      chip.addEventListener('click', () => {
        const control = barra.querySelector(`[data-clave="${clave}"]`);
        if (control) control.value = '';
        store.clear(clave);
      });
      zonaChips.appendChild(chip);
    }
  }

  function pestanas() {
    document.querySelectorAll('.tabs button').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.tabs button').forEach(otro =>
          otro.setAttribute('aria-selected', String(otro === b)));
        views.estado.vista = b.dataset.view;
        construirBarra();
        const fuente = FUENTES[views.estado.vista];
        if (fuente) pintarChipsFuente(fuente);
        else pintarChips();
        views.render();
      });
    });
  }

  construirBarra();
  pestanas();
  store.onChange(() => { pintarChips(); views.render(); });
  storeIaas.onChange(() => { pintarChipsFuente(FUENTES.iaas); views.render(); });
  storeVig.onChange(() => {
    pintarChipsFuente(FUENTES.vigilancia); views.render();
  });
  // Repintar los gráficos al cambiar de tema: Chart.js copió los colores
  // al construirse y no vuelve a leer las variables CSS por su cuenta.
  window.addEventListener('themechange', () => views.render());
  matchMedia('(prefers-color-scheme: dark)')
    .addEventListener('change', () => views.render());
  views.render();

  return {pintarChips};
})();

document.getElementById('theme').addEventListener('click', () => {
  const actual = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', actual === 'dark' ? 'light' : 'dark');
  window.dispatchEvent(new Event('themechange'));
});
</script>
</body>
</html>
