<h1>Pruebas de store y agg</h1>
<div id="out"></div>

<script>
// DATA sintético: 9 filas, 4 responsables, 2 meses.
// Ana: SI, NO, SI -> tasa 2/3. Beto: SI, sin dictamen -> tasa 1/1.
// Carlos: NO, NO -> tasa 0 (0% real, distinto de sin dictamen).
// Dora: sin dictamen, sin dictamen -> tasa null (no 0).
const DATA = {
  dims: {
    responsable: ["Ana", "Beto", "Carlos", "Dora"],
    formulario: ["F001", "F002"],
    medida: ["Estándar", "Específica"],
    submedida: ["Higiene", "Barreras"],
    unidad: ["UCI", "Emergencia"],
    area: ["Box 1", "Triage"],
    grupo: ["Enfermería", "Medicina"],
    cargo: ["Técnico", "Jefe"],
    estado: ["Aprobado", "En espera"],
    riesgo: ["(Sin nivel de riesgo)", "Alto"],
    motivo: ["", "Sin insumos"],
    mes: ["2026-07", "2026-08"],
    semana: ["2026-W27", "2026-W28", "2026-W32"]
  },
  forms: {
    F001: {nombre: "Lavado", version: 1, medida: "Estándar", submedida: "Higiene"},
    F002: {nombre: "Guantes", version: 2, medida: "Específica", submedida: "Barreras"}
  },
  rows: {
    responsable: [0, 0, 0, 1, 1, 2, 2, 3, 3],
    formulario:  [0, 0, 1, 1, 1, 0, 0, 0, 0],
    medida:      [0, 0, 1, 1, 1, 0, 0, 0, 0],
    submedida:   [0, 0, 1, 1, 1, 1, 1, 0, 0],
    unidad:      [0, 1, 0, 0, 1, 1, 1, 1, 1],
    area:        [0, 1, 0, 1, 0, 1, 1, 1, 1],
    grupo:       [0, 0, 1, 1, 0, 0, 0, 0, 0],
    cargo:       [0, 0, 0, 0, 1, 1, 1, 1, 1],
    estado:      [0, 1, 1, 1, 1, 0, 1, 0, 1],
    riesgo:      [0, 1, 0, 0, 0, 0, 0, 0, 0],
    motivo:      [0, 1, 0, 0, 0, 1, 1, 0, 0],
    mes:         [0, 0, 1, 0, 1, 0, 0, 0, 0],
    semana:      [0, 1, 2, 1, 2, 0, 0, 0, 0],
    dia:         [20635, 20642, 20670, 20642, 20670, 20636, 20637, 20638, 20639],
    cumple:      [1, 0, 1, 1, -1, 0, 0, -1, -1],
    pct:         [100, 60, 100, 90, 80, 0, 0, 50, 50],
    si:          [5, 3, 4, 4, 4, 0, 0, 0, 0],
    no:          [0, 2, 0, 1, 0, 5, 5, 0, 0],
    na:          [1, 1, 2, 0, 0, 0, 0, 5, 5]
  },
  texts: {
    evaluado: ["Juan", "Luis", "Marta", "Rosa", "Ema", "Nora", "Oscar", "Paco", "Quica"],
    conclusiones: {"1": "Reponer jabón"}
  },
  meta: {generado: "2026-08-24 09:00", filas: 9, dia_min: 20635, dia_max: 20670}
};

let pasadas = 0, fallidas = 0;
function check(nombre, real, esperado) {
  const a = JSON.stringify(real), b = JSON.stringify(esperado);
  const ok = a === b;
  ok ? pasadas++ : fallidas++;
  const linea = document.createElement('div');
  linea.className = ok ? 'ok' : 'fail';
  linea.textContent = (ok ? 'PASA  ' : 'FALLA ') + nombre +
    (ok ? '' : ` — esperado ${b}, obtenido ${a}`);
  document.getElementById('out').appendChild(linea);
}
function resumen() {
  const linea = document.createElement('h2');
  linea.textContent = `${pasadas} pasan, ${fallidas} fallan`;
  linea.className = fallidas ? 'fail' : 'ok';
  document.getElementById('out').appendChild(linea);
}
</script>

<script id="mod-store">
const store = (() => {
  const DIMS_FILTRABLES = [
    'medida', 'submedida', 'unidad', 'grupo', 'cargo', 'estado'
  ];
  const filters = {desde: null, hasta: null};
  DIMS_FILTRABLES.forEach(k => { filters[k] = null; });

  const oyentes = [];
  const n = DATA.rows.cumple.length;

  function activeRows() {
    const r = DATA.rows;
    const out = [];
    for (let i = 0; i < n; i++) {
      if (filters.desde !== null && r.dia[i] < filters.desde) continue;
      if (filters.hasta !== null && r.dia[i] > filters.hasta) continue;
      let pasa = true;
      for (const k of DIMS_FILTRABLES) {
        if (filters[k] !== null && r[k][i] !== filters[k]) { pasa = false; break; }
      }
      if (pasa) out.push(i);
    }
    return out;
  }

  function set(clave, valor) { filters[clave] = valor; emit(); }
  function clear(clave) { filters[clave] = null; emit(); }
  function clearAll() {
    Object.keys(filters).forEach(k => { filters[k] = null; });
    emit();
  }
  function onChange(fn) { oyentes.push(fn); }
  function emit() { oyentes.forEach(fn => fn()); }

  return {filters, dimsFiltrables: DIMS_FILTRABLES,
          activeRows, set, clear, clearAll, onChange, emit};
})();
</script>
<script id="mod-agg">
/** Fábrica de agregación sobre un dataset con `rows` y `dims`.
 *
 * Es fábrica y no módulo suelto porque el dashboard tiene dos datasets —las
 * supervisiones y los envíos de IAAS— y duplicar la agregación para el
 * segundo dejaría dos copias que divergen.
 */
function crearAgg(dataset) {
  const r = dataset.rows;
  const DIMS = dataset.dims;

  /** Tasa sobre los registros con dictamen. null si no hay ninguno. */
  function tasaDe(si, no) {
    const conDictamen = si + no;
    return conDictamen === 0 ? null : si / conDictamen;
  }

  function kpis(rows) {
    let si = 0, no = 0, sin = 0, aprobados = 0;
    const resp = new Set(), form = new Set();
    const idxAprobado = DIMS.estado.indexOf('Aprobado');
    for (const i of rows) {
      if (r.cumple[i] === 1) si++;
      else if (r.cumple[i] === 0) no++;
      else sin++;
      if (r.estado[i] === idxAprobado) aprobados++;
      resp.add(r.responsable[i]);
      form.add(r.formulario[i]);
    }
    return {
      total: rows.length,
      conDictamen: si + no,
      sinDictamen: sin,
      tasa: tasaDe(si, no),
      aprobados,
      tasaAprobado: rows.length ? aprobados / rows.length : null,
      responsables: resp.size,
      formularios: form.size
    };
  }

  /** Fila de total para una tabla construida con `rateBy`.
   *
   * La tasa se pondera por volumen —se recalcula sobre la suma de dictámenes—
   * en vez de promediar las tasas por fila. Promediarlas daría a un formulario
   * de dos registros el mismo peso que a uno de doscientos, y el número no
   * cuadraría con el KPI de cumplimiento de la misma vista.
   */
  function totalDe(entradas) {
    let si = 0, no = 0, total = 0;
    for (const e of entradas) { si += e.si; no += e.no; total += e.total; }
    return {n: entradas.length, total, tasa: tasaDe(si, no)};
  }

  function rateBy(rows, dimKey) {
    const etiquetas = DIMS[dimKey];
    const acc = new Map();
    for (const i of rows) {
      const idx = r[dimKey][i];
      let e = acc.get(idx);
      if (!e) { e = {idx, label: etiquetas[idx], si: 0, no: 0, sin: 0}; acc.set(idx, e); }
      if (r.cumple[i] === 1) e.si++;
      else if (r.cumple[i] === 0) e.no++;
      else e.sin++;
    }
    const salida = [...acc.values()];
    for (const e of salida) {
      e.total = e.si + e.no + e.sin;
      e.tasa = tasaDe(e.si, e.no);
    }
    // Los que no tienen dictamen van al final: no son "los peores", son
    // "los que no se pueden puntuar".
    salida.sort((a, b) => {
      if (a.tasa === null && b.tasa === null) return b.total - a.total;
      if (a.tasa === null) return 1;
      if (b.tasa === null) return -1;
      return b.tasa - a.tasa || b.total - a.total;
    });
    return salida;
  }

  function series(rows, periodo) {
    const etiquetas = DIMS[periodo];
    const presentes = new Set();
    const si = new Map(), no = new Map(), vol = new Map();
    for (const i of rows) {
      const p = r[periodo][i];
      presentes.add(p);
      vol.set(p, (vol.get(p) || 0) + 1);
      if (r.cumple[i] === 1) si.set(p, (si.get(p) || 0) + 1);
      else if (r.cumple[i] === 0) no.set(p, (no.get(p) || 0) + 1);
    }
    // dims.mes y dims.semana vienen ordenados alfabéticamente desde Python,
    // que para "YYYY-MM" y "YYYY-Www" equivale al orden cronológico.
    const presentesOrdenados = [...presentes].sort((a, b) => a - b);
    // Se completan los períodos intermedios sin filas para que un hueco de
    // varios meses se vea como un hueco (la línea se corta ahí gracias a
    // spanGaps: false) y no como un solo paso que aplana la tendencia real.
    const orden = presentesOrdenados.length
      ? Array.from(
          {length: presentesOrdenados[presentesOrdenados.length - 1]
                   - presentesOrdenados[0] + 1},
          (_, k) => presentesOrdenados[0] + k
        )
      : [];
    return {
      labels: orden.map(p => etiquetas[p]),
      volumen: orden.map(p => vol.get(p) || 0),
      tasa: orden.map(p => tasaDe(si.get(p) || 0, no.get(p) || 0))
    };
  }

  function heatmap(rows, dimKey, periodo) {
    const filasPresentes = new Set(), colsPresentes = new Set();
    const si = new Map(), no = new Map(), tot = new Map();
    const clave = (f, c) => f + '|' + c;
    for (const i of rows) {
      const f = r[dimKey][i], c = r[periodo][i];
      filasPresentes.add(f); colsPresentes.add(c);
      const k = clave(f, c);
      tot.set(k, (tot.get(k) || 0) + 1);
      if (r.cumple[i] === 1) si.set(k, (si.get(k) || 0) + 1);
      else if (r.cumple[i] === 0) no.set(k, (no.get(k) || 0) + 1);
    }
    const fs = [...filasPresentes].sort((a, b) => a - b);
    const cs = [...colsPresentes].sort((a, b) => a - b);
    return {
      rowLabels: fs.map(f => DIMS[dimKey][f]),
      colLabels: cs.map(c => DIMS[periodo][c]),
      cells: fs.map(f => cs.map(c => {
        const k = clave(f, c);
        return {
          tasa: tasaDe(si.get(k) || 0, no.get(k) || 0),
          total: tot.get(k) || 0
        };
      }))
    };
  }

  return {kpis, rateBy, series, heatmap, tasaDe, totalDe};
}
const agg = crearAgg(DATA);
</script>
<script id="mod-iaas">
/** Agregación del apartado de IAAS.
 *
 * Mide producción: cuántos envíos declararon cada actividad, por quién,
 * dónde y cuándo. Las respuestas SI/NO del formulario no se publican, así
 * que aquí no hay tasas — solo recuentos.
 */
function crearIaas(iaas) {
  const r = iaas.rows;
  const n = iaas.meta.filas;
  const nAct = iaas.actividades.length;

  function filasActivas(f) {
    const out = [];
    for (let i = 0; i < n; i++) {
      if (f.desde !== null && r.dia[i] < f.desde) continue;
      if (f.hasta !== null && r.dia[i] > f.hasta) continue;
      if (f.responsable !== null && r.responsable[i] !== f.responsable) continue;
      if (f.servicio !== null && r.servicio[i] !== f.servicio) continue;
      if (f.actividad !== null && r.actividades[f.actividad][i] !== 1) continue;
      out.push(i);
    }
    return out;
  }

  /** Recuento de envíos que declararon cada actividad. */
  function cuenta(filas) {
    const out = new Array(nAct).fill(0);
    for (const i of filas) {
      for (let a = 0; a < nAct; a++) if (r.actividades[a][i] === 1) out[a]++;
    }
    return out;
  }

  function kpis(filas) {
    return {registros: filas.length, porActividad: cuenta(filas)};
  }

  function porActividad(filas) {
    const c = cuenta(filas);
    return iaas.actividades.map((label, a) => ({
      idx: a, label, registros: c[a], principal: a < iaas.principales
    }));
  }

  function porDim(filas, clave) {
    const etiquetas = iaas.dims[clave];
    const acc = new Map();
    for (const i of filas) {
      const idx = r[clave][i];
      let e = acc.get(idx);
      if (!e) {
        e = {idx, label: etiquetas[idx], registros: 0,
             actividades: new Array(nAct).fill(0)};
        acc.set(idx, e);
      }
      e.registros++;
      for (let a = 0; a < nAct; a++) if (r.actividades[a][i] === 1) e.actividades[a]++;
    }
    const salida = [...acc.values()];
    // Quien más produce, arriba. A igualdad de volumen, orden alfabético
    // para que el listado no baile entre builds.
    salida.sort((a, b) => b.registros - a.registros ||
                          a.label.localeCompare(b.label, 'es'));
    return salida;
  }

  function series(filas, periodo) {
    const etiquetas = iaas.dims[periodo];
    const vol = etiquetas.map(() => 0);
    const porAct = iaas.actividades.map(() => etiquetas.map(() => 0));
    for (const i of filas) {
      const k = r[periodo][i];
      vol[k]++;
      for (let a = 0; a < nAct; a++) if (r.actividades[a][i] === 1) porAct[a][k]++;
    }
    return {labels: etiquetas, volumen: vol, porActividad: porAct};
  }

  return {filasActivas, kpis, porActividad, porDim, series};
}
</script>

<script>
check('sin filtros devuelve todas las filas', store.activeRows(),
      [0,1,2,3,4,5,6,7,8]);
store.set('unidad', 0);
check('filtro por unidad UCI', store.activeRows(), [0,2,3]);
store.clearAll();
store.set('desde', 20660);
check('filtro por fecha desde', store.activeRows(), [2,4]);
store.clearAll();
store.set('medida', 1); store.set('cargo', 0);
check('dos filtros se combinan con AND', store.activeRows(), [2,3]);
store.clearAll();
check('clearAll restaura todo', store.activeRows(), [0,1,2,3,4,5,6,7,8]);

store.clearAll();
const todas = store.activeRows();

const k = agg.kpis(todas);
check('kpis total', k.total, 9);
check('kpis con dictamen', k.conDictamen, 6);
check('kpis sin dictamen', k.sinDictamen, 3);
check('kpis tasa', k.tasa, 0.5);
check('kpis aprobados', k.aprobados, 3);
check('kpis tasaAprobado', k.tasaAprobado, 1 / 3);
check('kpis responsables', k.responsables, 4);
check('kpis formularios', k.formularios, 2);

const porResp = agg.rateBy(todas, 'responsable');
check('rateBy ordena por tasa descendente, nulls al final',
      porResp.map(f => f.label), ['Beto', 'Ana', 'Carlos', 'Dora']);
check('rateBy tasa de Ana', porResp[1].tasa, 2 / 3);
check('rateBy total de Beto cuenta el sin dictamen', porResp[0].total, 2);
check('rateBy con dictamen de Beto', porResp[0].si + porResp[0].no, 1);
check('rateBy tasa de Carlos es 0 real, no null', porResp[2].tasa, 0);
check('rateBy tasa de Dora es null (sin dictamen), no 0', porResp[3].tasa, null);

const totalResp = agg.totalDe(porResp);
check('totalDe cuenta las entradas', totalResp.n, 4);
check('totalDe suma las supervisiones', totalResp.total, 9);
// Ponderada: 3 de 6 con dictamen. El promedio simple de las tasas daria
// (1 + 2/3 + 0) / 3 = 0.555..., que es otro numero y no coincide con kpis.
check('totalDe pondera por volumen, no promedia tasas',
      totalResp.tasa, 0.5);
check('totalDe coincide con la tasa de kpis', totalResp.tasa, k.tasa);
check('totalDe sin ningun dictamen da null, no 0',
      agg.totalDe([{total: 2, si: 0, no: 0}]).tasa, null);
check('totalDe de una lista vacia',
      agg.totalDe([]), {n: 0, total: 0, tasa: null});

const aggAlterno = crearAgg({dims: DATA.dims, rows: DATA.rows});
check('crearAgg devuelve un agregador equivalente',
      aggAlterno.kpis(todas).tasa, agg.kpis(todas).tasa);
check('crearAgg no comparte estado entre instancias',
      aggAlterno.rateBy(todas, 'responsable').length,
      agg.rateBy(todas, 'responsable').length);

// DATA.iaas sintético: 3 envíos, 3 actividades (2 principales).
const IAAS = {
  ok: true,
  dims: {responsable: ['Ana', 'Beto'], servicio: ['UCI', 'Nefrología'],
         mes: ['2026-07', '2026-08'], semana: ['2026-W30', '2026-W31']},
  actividades: ['NUEVOS', 'SEGUIMIENTO', 'VISITAS'],
  principales: 2,
  rows: {
    dia:         [20655, 20656, 20690],
    responsable: [0, 1, 0],
    servicio:    [0, 0, 1],
    mes:         [0, 0, 1],
    semana:      [0, 0, 1],
    actividades: [[1, 1, 0], [0, 1, 1], [1, 0, 0]]
  },
  meta: {filas: 3, pacientes: 2, dia_min: 20655, dia_max: 20690}
};
const iaas = crearIaas(IAAS);
const sinFiltros = {desde: null, hasta: null, responsable: null,
                    servicio: null, actividad: null};
const todasIaas = iaas.filasActivas(sinFiltros);

check('iaas filasActivas sin filtros', todasIaas, [0, 1, 2]);
check('iaas filtro por responsable',
      iaas.filasActivas({...sinFiltros, responsable: 0}), [0, 2]);
check('iaas filtro por actividad usa el booleano de la fila',
      iaas.filasActivas({...sinFiltros, actividad: 1}), [1, 2]);
check('iaas filtro por fecha desde',
      iaas.filasActivas({...sinFiltros, desde: 20690}), [2]);

check('iaas kpis cuenta registros', iaas.kpis(todasIaas).registros, 3);
check('iaas kpis cuenta cada actividad',
      iaas.kpis(todasIaas).porActividad, [2, 2, 1]);

check('iaas porActividad devuelve etiqueta y recuento',
      iaas.porActividad(todasIaas).map(e => [e.label, e.registros]),
      [['NUEVOS', 2], ['SEGUIMIENTO', 2], ['VISITAS', 1]]);
check('iaas porActividad marca cuales son principales',
      iaas.porActividad(todasIaas).map(e => e.principal),
      [true, true, false]);

check('iaas porDim cuenta por actividad dentro de cada valor',
      iaas.porDim(todasIaas, 'responsable').map(e => [e.label, e.registros, e.actividades]),
      [['Ana', 2, [1, 1, 1]], ['Beto', 1, [1, 1, 0]]]);
check('iaas porDim ordena por registros descendente',
      iaas.porDim(todasIaas, 'servicio').map(e => e.label), ['UCI', 'Nefrología']);

check('iaas series volumen por mes', iaas.series(todasIaas, 'mes').volumen, [2, 1]);
check('iaas series una linea por actividad',
      iaas.series(todasIaas, 'mes').porActividad, [[2, 0], [1, 1], [1, 0]]);

const mes = agg.series(todas, 'mes');
check('series etiquetas de mes', mes.labels, ['2026-07', '2026-08']);
check('series volumen por mes', mes.volumen, [7, 2]);
check('series tasa de julio', mes.tasa[0], 0.4);
check('series tasa de agosto', mes.tasa[1], 1);

const semana = agg.series(todas, 'semana');
check('series etiquetas de semana', semana.labels,
      ['2026-W27', '2026-W28', '2026-W32']);
check('series volumen por semana', semana.volumen, [5, 2, 2]);

const calor = agg.heatmap(todas, 'submedida', 'mes');
check('heatmap filas', calor.rowLabels, ['Higiene', 'Barreras']);
check('heatmap columnas', calor.colLabels, ['2026-07', '2026-08']);
check('heatmap celda Barreras/agosto', calor.cells[1][1], {tasa: 1, total: 2});
check('heatmap celda vacía es null',
      calor.cells[0][1], {tasa: null, total: 0});

const vacio = agg.kpis([]);
check('kpis sobre conjunto vacío no divide por cero', vacio.tasa, null);
check('series sobre conjunto vacío', agg.series([], 'mes').labels, []);

resumen();
</script>
